<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review | STREAMguide BD</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/television.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Anton&family=Inter:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090a0c; --surface: #12141c; --surface-2: #1c1f2b;
            --text: #ffffff; --text-dim: #9ca3af;
            --marquee: #e8482c; --gold: #ffc857; 
            --line: #262933; --focus-color: #00ffcc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Hind Siliguri', sans-serif; -webkit-font-smoothing: antialiased; }
        a { color: inherit; text-decoration: none; }

        header { background: rgba(9,10,12,0.95); backdrop-filter: blur(15px); border-bottom: 1px solid var(--line); padding: 16px 24px; text-align: center; position: sticky; top: 0; z-index: 50; }
        .logo { font-family: 'Anton', sans-serif; font-size: 28px; letter-spacing: -0.015em; display: inline-flex; align-items: baseline; cursor: pointer; }
        .logo span.stream { color: var(--text); font-weight: 900; }
        .logo span.guide-thin { color: var(--marquee); font-family: 'Sacramento',cursive; font-weight: 400; font-size: 34px; margin-left: -4px; }
        .logo span.bd { color: var(--marquee); font-weight: 900; margin-left: 8px; -webkit-text-stroke: 1px #fff; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 24px; }
        
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--line); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .review-header { margin-bottom: 24px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
        .review-title { font-family: 'Anton', sans-serif; font-size: 42px; line-height: 1.1; margin-bottom: 12px; color: #fff; }
        .review-meta { display: flex; align-items: center; gap: 15px; font-size: 15px; color: var(--gold); font-weight: 700; }

        .review-content { font-size: 17px; line-height: 1.8; color: #d1d5db; margin-bottom: 40px; text-align: justify; }

        .cta-section { text-align: center; margin-top: 40px; padding: 30px; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); }
        .cta-button { display: inline-flex; align-items: center; gap: 10px; background: var(--marquee); color: #fff; font-weight: 700; font-size: 18px; padding: 16px 36px; border-radius: 12px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(232,72,44,0.3); transition: 0.3s; outline:none; text-decoration: none; }
        .cta-button:hover { background: #fff; color: #000; transform: scale(1.05); box-shadow: 0 0 20px var(--focus-color); }

        .loading, .error { text-align: center; padding: 100px 20px; font-size: 18px; color: var(--text-dim); }
        
        footer { border-top: 1px solid var(--line); padding: 20px 24px; margin-top: 50px; text-align: center; font-size: 14px; color: var(--text-dim); }
        .dev-credit { color: var(--gold); font-weight: 600; margin-top: 8px; display: block; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <span class="stream">STREAM</span><span class="guide-thin">guide</span><span class="bd">BD</span>
        </a>
    </header>

    <div id="content-container">
        <div class="loading">Loading Review...</div>
    </div>

    <footer>
        <div>© 2026 STREAMguide BD</div>
        <span class="dev-credit">✍️ Review & Developed by @nazmulsblog</span>
    </footer>

    <script>
        // ইউআরএল (URL) থেকে মুভির নাম এবং আইডি বের করা
        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('title');
        const contentId = urlParams.get('cid');

        const container = document.getElementById('content-container');

        if(!movieTitle) {
            container.innerHTML = '<div class="error">Review not found! Please go back to the homepage.</div>';
        } else {
            // reviews.json থেকে ডেটা টানা
            fetch('reviews.json')
                .then(response => response.json())
                .then(reviews => {
                    // নামের সাথে মিলিয়ে রিভিউ বের করা
                    const review = reviews.find(r => r.movie_name.trim().toLowerCase() === movieTitle.trim().toLowerCase());

                    if(review) {
                        // হোমপেজে ব্যাক করে মডেল ওপেন করার লিংক
                        const watchLink = contentId ? `index.html?modal=${contentId}` : `index.html`;

                        container.innerHTML = `
                            <div class="container">
                                <div class="video-wrapper">
                                    <iframe src="${review.youtube_embed_link}" allowfullscreen></iframe>
                                </div>
                                
                                <div class="review-header">
                                    <h1 class="review-title">${review.movie_name}</h1>
                                    <div class="review-meta">
                                        <span>⭐ STREAMguide Rating: ${review.rating}</span>
                                    </div>
                                </div>

                                <div class="review-content">
                                    ${review.review_text.replace(/\n/g, '<br><br>')}
                                </div>

                                <div class="cta-section">
                                    <p style="color: var(--text-dim); margin-bottom: 15px; font-size: 14px;">Ready to dive in?</p>
                                    <a href="${watchLink}" class="cta-button">▶ Watch Content on STREAMguide</a>
                                </div>
                            </div>
                        `;
                    } else {
                        container.innerHTML = '<div class="error">Review details not available for this content.</div>';
                    }
                })
                .catch(err => {
                    console.error('Error fetching review:', err);
                    container.innerHTML = '<div class="error">Failed to load review data.</div>';
                });
        }
    </script>
</body>
</html>
