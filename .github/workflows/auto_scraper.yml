name: STREAMguide Auto Data Scraper

on:
  schedule:
    - cron: '0 0,12 * * *' # আপনার প্রয়োজন মতো শিডিউল রাখতে পারেন
  workflow_dispatch: # ম্যানুয়াল রানের জন্য

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Run Scraper Script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL_CHORKI: ${{ secrets.URL_CHORKI }}
          URL_HOICHOI: ${{ secrets.URL_HOICHOI }}
          URL_BONGO: ${{ secrets.URL_BONGO }}
          URL_TOFFEE: ${{ secrets.URL_TOFFEE }}
          URL_BINGE: ${{ secrets.URL_BINGE }}
          URL_UTSHOB: ${{ secrets.URL_UTSHOB }}
          URL_DEEPTO: ${{ secrets.URL_DEEPTO }}
          URL_BIOSCOPE_BASE: ${{ secrets.URL_BIOSCOPE_BASE }}
          URL_BIOSCOPE_FETCH: ${{ secrets.URL_BIOSCOPE_FETCH }}
        run: python All_Site_Scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto Update Data and Clear Deletelist" || echo "No changes to commit"
          git push
