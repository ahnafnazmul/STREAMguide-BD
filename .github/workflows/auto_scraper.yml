name: STREAMguide Auto Data Scraper

on:
  schedule:
    - cron: '0 5,15 * * *'
  workflow_dispatch:

# 🌟 ম্যাজিক ফিক্স: বটকে রিপোজিটরিতে ফাইল সেভ করার পারমিশন দেওয়া হলো 🌟
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # Warning দূর করতে v4 ব্যবহার করা হলো
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Warning দূর করতে v5 ব্যবহার করা হলো
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper Script
        run: |
          python All_Site_Scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "STREAMguide Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json with new releases" && git push)
