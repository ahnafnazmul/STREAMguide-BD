name: STREAMguide Auto Data Scraper

on:
  schedule:
    # বাংলাদেশ সময় সকাল ৯টা, দুপুর ১২টা, দুপুর ৩টা, সন্ধ্যা ৬টা, রাত ৯টা এবং রাত ১২টায় রান হবে
    - cron: '0 3,6,9,12,15,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper Script
        # এখানে আমরা গিটহাবের Secrets এবং Variables গুলোকে পাইথনের জন্য এনভায়রনমেন্ট ভ্যারিয়েবল হিসেবে পাস করে দিচ্ছি
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL_CHORKI: ${{ vars.URL_CHORKI }}
          URL_HOICHOI: ${{ vars.URL_HOICHOI }}
          URL_BONGO: ${{ vars.URL_BONGO }}
          URL_TOFFEE: ${{ vars.URL_TOFFEE }}
          URL_BINGE: ${{ vars.URL_BINGE }}
          URL_UTSHOB: ${{ vars.URL_UTSHOB }}
          URL_DEEPTO: ${{ vars.URL_DEEPTO }}
          URL_BIOSCOPE_BASE: ${{ vars.URL_BIOSCOPE_BASE }}
          URL_BIOSCOPE_FETCH: ${{ vars.URL_BIOSCOPE_FETCH }}
        run: |
          python All_Site_Scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "STREAMguide Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json with new releases" && git push)
