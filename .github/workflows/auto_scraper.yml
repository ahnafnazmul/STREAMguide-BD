name: STREAMguide Auto Data Scraper

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ১১টা (UTC 05:00) এবং রাত ৯টায় (UTC 15:00) রান করবে
    - cron: '0 5,15 * * *'
  
  # ম্যানুয়ালি রান করার জন্য
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper Script
        run: |
          # আপনার পাইথন ফাইলের নাম রান করা হচ্ছে
          python All_Site_Scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "STREAMguide Bot"
          git add data.json
          # যদি নতুন কোনো ডেটা থাকে, তবেই সে কমিট ও পুশ করবে
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json with new releases" && git push)
