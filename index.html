<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STREAMguide BD | First & #1 OTT Streaming Guide for Bangladesh</title>
<meta name="theme-color" content="#0c0f1d">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Anton&family=Inter:wght@300;400;600;700;800;900&family=Sacramento&display=swap" rel="stylesheet">
<!-- Tailwind CSS (Movieplexbd Color Scheme) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    body { background-color: #0c0f1d; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .scroller { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .scroller::-webkit-scrollbar { height: 4px; }
    .scroller::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.01); }
    .scroller::-webkit-scrollbar-thumb { background: rgba(234, 179, 8, 0.3); border-radius: 10px; }
    
    /* 🌟 TV D-Pad Focus Styles 🌟 */
    .tv-focusable { outline: none; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; border: 2px solid transparent; }
    .tv-focusable:focus { border-color: #eab308 !important; box-shadow: 0 0 20px rgba(234, 179, 8, 0.6) !important; transform: scale(1.08); z-index: 50; }
    .chip-focus:focus { transform: scale(1.05); border-color: #eab308 !important; background-color: #eab308 !important; color: #000 !important; }

    /* Original STREAMguide BD Logo Styling */
    .logo { font-family: 'Anton', sans-serif; font-size: 26px; letter-spacing: -0.015em; display: flex; align-items: baseline; }
    .logo span.stream { color: #ffffff; font-weight: 900; }
    .logo span.guide-thin { color: #e8482c; font-family: 'Sacramento', cursive; font-weight: 400; font-size: 34px; margin-left: -4px; }
    .logo span.bd { color: #e8482c; font-weight: 900; margin-left: 6px; -webkit-text-stroke: 1px #fff; }

    /* 3D BACKGROUND CAROUSEL ENGINE (Movieplexbd Style) */
    .carousel-container-fixed { position: relative; width: 100%; height: 320px; overflow: visible; background-color: #060814; margin-top: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    @media (min-width: 768px) { .carousel-container-fixed { height: 440px; } }
    .carousel-viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; perspective: 1400px; overflow: visible; z-index: 10; }
    .carousel-wheel-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    
    .wheel-node { 
        position: absolute; width: 140px; height: 210px; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; border: 2px solid rgba(255,255,255,0.04); outline: none;
    }
    @media (min-width: 768px) { .wheel-node { width: 220px; height: 315px; border-radius: 20px; } }

    .wheel-node.active-center { transform: scale(1.1) translateX(20px) translateZ(60px); z-index: 40; opacity: 1; border-color: rgba(234,179,8,0.5); }
    @media (min-width: 768px) { .wheel-node.active-center { transform: scale(1.15) translateX(100px) translateZ(120px); } }
    .wheel-node.side-L1 { transform: scale(0.85) translateX(-80px) translateZ(10px) rotateY(20deg); z-index: 30; opacity: 0.15; }
    .wheel-node.side-R1 { transform: scale(0.85) translateX(140px) translateZ(10px) rotateY(-20deg); z-index: 30; opacity: 0.60; }
    @media (min-width: 768px) {
        .wheel-node.side-L1 { transform: scale(0.92) translateX(-100px) translateZ(20px) rotateY(25deg); opacity: 0.20; }
        .wheel-node.side-R1 { transform: scale(0.92) translateX(320px) translateZ(20px) rotateY(-25deg); opacity: 0.65; }
    }
    .wheel-node.side-L2 { transform: scale(0.7) translateX(-160px) rotateY(30deg); z-index: 20; opacity: 0.05; }
    .wheel-node.side-R2 { transform: scale(0.7) translateX(230px) rotateY(-30deg); z-index: 20; opacity: 0.35; }
    @media (min-width: 768px) {
        .wheel-node.side-L2 { transform: scale(0.76) translateX(-280px) translateZ(-50px) rotateY(38deg); opacity: 0.08; }
        .wheel-node.side-R2 { transform: scale(0.76) translateX(520px) translateZ(-50px) rotateY(-38deg); opacity: 0.40; }
    }
    .wheel-node.invisible-loop { transform: scale(0.4) translateZ(-250px); z-index: 5; opacity: 0; pointer-events: none; }

    #wheel-meta-pane { display: none; }
    @media (min-width: 1024px) { #wheel-meta-pane { display: block; } }

    /* Modal Animation */
    .modal-overlay { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(6,8,20,0.95); backdrop-filter: blur(10px); }
    .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease-out; }
    .modal-card { width: 100%; max-width: 900px; max-height: 85vh; background: #0c0f1d; border: 1px solid rgba(234,179,8,0.2); border-radius: 20px; overflow-y: auto; box-shadow: 0 30px 100px rgba(0,0,0,0.9); outline: none; }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

    .adult-blur { filter: blur(28px) saturate(1.2); transform: scale(1.15); }
</style>
</head>
<body class="relative min-h-screen pb-[120px] md:pb-[100px]">

    <!-- HEADER MENU BAR -->
    <header class="w-full bg-[#060814]/95 backdrop-blur-md border-b border-white/5 sticky top-0 z-50 px-4 md:px-12 py-3 flex items-center justify-between shadow-xl">
        <div class="brand cursor-pointer tv-focusable rounded-lg p-1" onclick="window.location.reload()" tabindex="0">
            <div class="logo"><span class="stream">STREAM</span><span class="guide-thin">guide</span><span class="bd">BD</span></div>
            <div class="text-[9px] text-gray-500 uppercase tracking-widest mt-0.5">OTT Streaming Guide</div>
        </div>
        <div class="flex gap-2">
            <!-- Platform Filters Logic preserved from STREAMguide -->
            <div id="filters-container" class="hidden md:flex space-x-2"></div>
        </div>
    </header>

    <!-- MOBILE FILTERS ROW -->
    <div class="w-full bg-[#060814] border-b border-white/5 py-2 px-4 overflow-x-auto scroller flex md:hidden space-x-2" id="mobile-filters-container"></div>

    <!-- VIEW A: HOME VIEW -->
    <div id="home-view-container" class="block">
        <!-- 3D CAROUSEL -->
        <div class="carousel-container-fixed">
            <div class="absolute top-12 left-6 md:left-12 max-w-sm md:max-w-md space-y-4 text-left z-30 pointer-events-auto" id="wheel-meta-pane">
                <span class="bg-yellow-500 text-black text-[9px] font-black uppercase px-2.5 py-1 rounded tracking-widest shadow shadow-yellow-500/10" id="wheel-platform">FEATURED</span>
                <h2 id="wheel-title" class="text-2xl md:text-4xl font-black text-white tracking-tight leading-none drop-shadow-md">Loading...</h2>
                <div class="flex items-center space-x-4 text-xs font-bold text-gray-400">
                    <span id="wheel-year">--</span>
                    <span id="wheel-rating" class="text-yellow-500">⭐ --</span>
                    <span id="wheel-views">--</span>
                </div>
                <p id="wheel-desc" class="text-gray-400 text-xs md:text-sm leading-relaxed line-clamp-3 max-w-sm font-light"></p>
                <button id="wheel-play-btn" class="tv-focusable bg-yellow-500 hover:bg-yellow-600 text-black font-black px-8 py-2.5 rounded-full text-xs tracking-wider uppercase shadow-xl" tabindex="0">
                    ▶ Watch Details
                </button>
            </div>
            <div class="carousel-viewport"><div class="carousel-wheel-wrapper" id="carousel-wheel-core"></div></div>
            <div class="absolute bottom-0 left-0 w-full h-20 bg-gradient-to-t from-[#0c0f1d] to-transparent pointer-events-none z-30"></div>
        </div>

        <!-- DYNAMIC DATE-BASED ROWS (STREAMguide Logic + Movieplex Design) -->
        <div class="pl-4 md:pl-12 space-y-7 relative z-40 bg-[#0c0f1d] pt-6 pb-4" id="rowsContainer">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- MODAL DETAILS VIEW (Hybrid Concept) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card tv-focusable flex flex-col md:flex-row relative" id="modalCard" tabindex="0">
            <!-- JS Inject Modal Content Here -->
        </div>
    </div>

    <!-- 🔒 FIXED HUD PANEL (Movieplexbd Style) -->
    <div class="fixed bottom-0 left-0 w-full z-[150] bg-[#060814]/95 backdrop-blur-md border-t border-white/10 shadow-[0_-10px_25px_rgba(0,0,0,0.95)] px-4 md:px-12 py-2.5 space-y-1 select-none">
        <div class="w-full flex justify-between items-center text-[9px] md:text-[10.5px] font-bold tracking-tight text-gray-400 uppercase">
            <div class="flex items-center space-x-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <p>ACTIVE: <span id="count-active" class="text-white font-extrabold ml-0.5">--</span></p>
                <span class="text-gray-800 text-[8px] mx-0.5">|</span>
                <p>TOTAL: <span id="count-total" class="text-white font-extrabold ml-0.5">--</span></p>
            </div>
            <div class="flex items-center space-x-1.5 text-right text-[8.5px] md:text-[10px]">
                <p>DATABASE: <span id="db-total" class="text-yellow-500 font-black ml-0.5">00</span></p>
            </div>
        </div>
        
        <div class="w-full flex justify-between items-center text-[8px] md:text-[9px] font-bold pt-1 border-t border-white/5">
            <div class="text-left text-gray-500 font-medium truncate max-w-[65%]">
                <span class="text-red-500 font-black uppercase mr-0.5">DISCLAIMER:</span>
                <span class="font-light text-gray-400">Does not host content. Aggregated from public APIs.</span>
            </div>
            <div class="text-right text-yellow-500 font-black tracking-wider text-[7.5px] md:text-[8.5px]">
                DEVELOPED BY @NAZMULSBLOG
            </div>
        </div>
    </div>

<script>
// 🌟 STREAMGUIDE LOGIC + MOVIEPLEX DESIGN ENGINE 🌟
const PLATFORMS = {
  chorki:   { name:"Chorki",      color:"#e8482c", group:"local" },
  bongo:    { name:"Bongo BD",    color:"#f2c14e", group:"local" },
  deepto:   { name:"Deepto Play", color:"#2ecc71", group:"local" },
  hoichoi:  { name:"Hoichoi",     color:"#f23557", group:"local" },
  bioscope: { name:"Bioscope",    color:"#2ea3f2", group:"local" },
  binge:    { name:"Binge",       color:"#00c2a8", group:"local" },
  toffee:   { name:"Toffee",      color:"#e0227a", group:"local" },
  netflix:  { name:"Netflix",     color:"#e50914", group:"intl" },
  prime:    { name:"Prime Video", color:"#00a8e1", group:"intl" },
  zee5:     { name:"Zee5",        color:"#7b2ff7", group:"intl" },
  sonyliv:  { name:"SonyLIV",     color:"#1ba1e2", group:"intl" },
};
const CHIP_ORDER = ["all", "chorki", "hoichoi", "bongo", "bioscope", "toffee", "binge", "intl"];

let DATA = [];
let activeFilter = "all";
let wheelIndex = 0;
let wheelTimer = null;

// Helpers
function fmtDate(d){ return d.toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'}); }
function hashSeed(str){ let h = 0; for(let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) | 0; } return Math.abs(h); }
function fakeRatingFor(t){ return (5.5 + (hashSeed(t) % 35) / 10).toFixed(1); }
function fakeViewsFor(t){ const val = 500 + (hashSeed(t + 'views') % 49500); return val >= 1000 ? (val/1000).toFixed(1) + 'k' : String(val); }

function processData(rawItems){
  return rawItems.map((x, i) => {
    const date = new Date((x.releaseDate || x.native_date) + 'T00:00:00');
    const days = Math.max(0, Math.floor((Date.now() - date.getTime()) / 86400000));
    return {
      ...x, id: i, date, days,
      rating: x.rating || fakeRatingFor(x.t), views: fakeViewsFor(x.t),
      safeYear: date.getFullYear() || '----'
    };
  });
}

function renderFilters() {
  let html = `<button class="tv-focusable chip-focus active bg-yellow-500 text-black border border-yellow-500 px-4 py-1.5 rounded-full text-[10px] font-black uppercase transition" data-p="all" tabindex="0">Featured</button>`;
  
  CHIP_ORDER.slice(1).forEach(key => {
    if(key === "intl") {
      html += `<button class="tv-focusable chip-focus bg-slate-900 text-gray-400 border border-slate-800 px-4 py-1.5 rounded-full text-[10px] font-black uppercase transition" data-p="intl" tabindex="0">🌐 Intl</button>`;
    } else if(PLATFORMS[key]) {
      html += `<button class="tv-focusable chip-focus bg-slate-900 text-gray-400 border border-slate-800 px-4 py-1.5 rounded-full text-[10px] font-black uppercase transition" data-p="${key}" tabindex="0">${PLATFORMS[key].name}</button>`;
    }
  });

  const desktop = document.getElementById('filters-container');
  const mobile = document.getElementById('mobile-filters-container');
  if(desktop) desktop.innerHTML = html;
  if(mobile) mobile.innerHTML = html;

  document.querySelectorAll('.chip-focus').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip-focus').forEach(c => {
          c.classList.remove('bg-yellow-500', 'text-black', 'active');
          c.classList.add('bg-slate-900', 'text-gray-400');
      });
      // Active state styling for all matching chips (desktop & mobile sync)
      document.querySelectorAll(`[data-p="${chip.dataset.p}"]`).forEach(c => {
          c.classList.remove('bg-slate-900', 'text-gray-400');
          c.classList.add('bg-yellow-500', 'text-black', 'active');
      });
      activeFilter = chip.dataset.p;
      renderLayout();
    });
  });
}

// 🎬 3D Wheel Logic
function build3DWheel(pool) {
    const wrapper = document.getElementById('carousel-wheel-core');
    wrapper.innerHTML = '';
    const safeSpotlight = pool.slice(0, 10);
    if(safeSpotlight.length === 0) return;
    
    safeSpotlight.forEach((movie, index) => {
        const node = document.createElement('div');
        node.className = "wheel-node invisible-loop tv-focusable";
        node.setAttribute('data-index', index);
        node.tabIndex = 0;
        node.innerHTML = `<img src="${movie.img && movie.img !== 'N/A' ? movie.img : 'https://placehold.co/300x450/1c1f2b/ffffff?text='+encodeURIComponent(movie.t)}" class="w-full h-full object-cover rounded-xl md:rounded-2xl">`;
        
        node.onclick = () => {
            if(index === wheelIndex) openModal(movie);
            else { wheelIndex = index; rotateWheelLogic(safeSpotlight); }
        };
        wrapper.appendChild(node);
    });

    rotateWheelLogic(safeSpotlight);
    if(wheelTimer) clearInterval(wheelTimer);
    wheelTimer = setInterval(() => {
        wheelIndex = (wheelIndex + 1) % safeSpotlight.length;
        rotateWheelLogic(safeSpotlight);
    }, 7000);
}

function rotateWheelLogic(items) {
    const nodes = document.querySelectorAll('.wheel-node');
    if(nodes.length === 0) return;
    const total = nodes.length;

    nodes.forEach(node => {
        const idx = parseInt(node.getAttribute('data-index'));
        let diff = idx - wheelIndex;
        if (diff < -total / 2) diff += total;
        if (diff > total / 2) diff -= total;

        node.className = "wheel-node invisible-loop tv-focusable";
        if (diff === 0) {
            node.className = "wheel-node active-center tv-focusable";
            const movie = items[wheelIndex];
            if(movie) {
                const plat = PLATFORMS[movie.p] || {name: movie.p};
                document.getElementById('wheel-title').innerText = movie.t;
                document.getElementById('wheel-desc').innerText = (movie.overview && movie.overview !== "N/A") ? movie.overview : "Detailed overview and streaming links available. Click Watch Details to explore.";
                document.getElementById('wheel-year').innerText = movie.safeYear;
                document.getElementById('wheel-rating').innerText = `⭐ ${movie.rating}`;
                document.getElementById('wheel-views').innerText = `Views: ${movie.views}`;
                document.getElementById('wheel-platform').innerText = plat.name.toUpperCase();
                document.getElementById('wheel-play-btn').onclick = () => openModal(movie);
            }
        }
        else if (diff === -1) node.className = "wheel-node side-L1 tv-focusable";
        else if (diff === 1) node.className = "wheel-node side-R1 tv-focusable";
        else if (diff === -2) node.className = "wheel-node side-L2 tv-focusable";
        else if (diff === 2) node.className = "wheel-node side-R2 tv-focusable";
    });
}

// 🖼️ Row Generation
function cardHTML(item) {
    const plat = PLATFORMS[item.p] || { name: item.p, color: "#eab308" };
    const imgSrc = item.img && item.img !== 'N/A' ? item.img : `https://placehold.co/300x450/1c1f2b/ffffff?text=${encodeURIComponent(item.t)}`;
    
    return `
    <div class="movie-card tv-focusable min-w-[110px] sm:min-w-[155px] bg-slate-900/40 rounded-xl overflow-hidden cursor-pointer relative shadow-xl flex-shrink-0 group" tabindex="0" data-id="${item.id}" onclick="openModalById(${item.id})">
        <div class="relative w-full pt-[142%] bg-slate-950">
            <img src="${imgSrc}" alt="${item.t}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
            <span class="absolute top-2 left-2 text-[9px] font-black px-2 py-0.5 rounded shadow-lg uppercase" style="background:${plat.color}; color:#000;">${plat.name}</span>
            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black via-black/90 to-transparent p-2 pt-8">
                <h4 class="text-[10px] sm:text-[11px] font-bold truncate text-gray-100 group-hover:text-yellow-500 transition">${item.t}</h4>
                <div class="flex justify-between items-center mt-0.5 text-[8px] sm:text-[9px] text-gray-400 font-bold">
                    <span>${item.safeYear}</span>
                    <span class="text-yellow-500">⭐ ${item.rating}</span>
                </div>
            </div>
        </div>
    </div>`;
}

function renderLayout() {
    let pool = DATA.filter(d => {
        const isIntl = PLATFORMS[d.p] && PLATFORMS[d.p].group === "intl";
        if(activeFilter === "all") return !isIntl; // Hide intl from 'all' by default
        if(activeFilter === "intl") return isIntl;
        return d.p === activeFilter;
    });

    pool.sort((a,b) => a.days - b.days); // Sort by newest
    build3DWheel(pool);

    const last7 = pool.filter(d => d.days <= 7);
    const d8to30 = pool.filter(d => d.days > 7 && d.days <= 30);
    const older = pool.filter(d => d.days > 30);

    const rowsEl = document.getElementById('rowsContainer');
    let html = '';
    
    if(last7.length){
        html += `<div class="space-y-2.5 row-scroll"><div class="flex justify-between items-center border-b border-white/5 pb-1 pr-4 md:pr-12"><h3 class="text-xs md:text-sm font-extrabold text-gray-200 flex items-center"><span class="w-1 h-3.5 bg-yellow-500 mr-2 rounded"></span>✨ New Releases (7 Days)</h3><span class="text-[10px] font-bold text-gray-400">${last7.length} Items</span></div><div class="flex space-x-3 overflow-x-auto scroller py-1.5 px-0.5">${last7.map(cardHTML).join('')}</div></div>`;
    }
    if(d8to30.length){
        html += `<div class="space-y-2.5 row-scroll"><div class="flex justify-between items-center border-b border-white/5 pb-1 pr-4 md:pr-12"><h3 class="text-xs md:text-sm font-extrabold text-gray-200 flex items-center"><span class="w-1 h-3.5 bg-blue-500 mr-2 rounded"></span>🎬 Recent (8-30 Days)</h3><span class="text-[10px] font-bold text-gray-400">${d8to30.length} Items</span></div><div class="flex space-x-3 overflow-x-auto scroller py-1.5 px-0.5">${d8to30.map(cardHTML).join('')}</div></div>`;
    }
    if(older.length){
        html += `<div class="space-y-2.5 row-scroll"><div class="flex justify-between items-center border-b border-white/5 pb-1 pr-4 md:pr-12"><h3 class="text-xs md:text-sm font-extrabold text-gray-200 flex items-center"><span class="w-1 h-3.5 bg-green-500 mr-2 rounded"></span>📚 Catalog / Older</h3><span class="text-[10px] font-bold text-gray-400">${older.length} Items</span></div><div class="flex space-x-3 overflow-x-auto scroller py-1.5 px-0.5">${older.map(cardHTML).join('')}</div></div>`;
    }
    
    if(!pool.length) {
        html = `<div class="text-center text-gray-500 text-xs py-10 font-bold uppercase tracking-widest">No Content Found in this category</div>`;
    }
    
    rowsEl.innerHTML = html;
}

// 🍿 Hybrid Modal Popup (Movieplexbd Details Style)
function openModalById(id) {
    const item = DATA.find(d => d.id === id);
    if(item) openModal(item);
}

function openModal(item) {
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCard = document.getElementById('modalCard');
    const plat = PLATFORMS[item.p] || { name: item.p, color: "#fff" };
    const imgSrc = item.img && item.img !== 'N/A' ? item.img : `https://placehold.co/400x600/1c1f2b/ffffff?text=${encodeURIComponent(item.t)}`;
    
    // Future-proof variables (Waiting for TMDB Scraper to fill these)
    const status = "Released";
    const country = "Bangladesh / India";
    const audioTrack = plat.group === 'intl' ? "Multi Audio / Eng" : "Bangla";
    const runtime = item.dur && item.dur !== 'N/A' ? item.dur : "Scanning...";
    const overview = item.overview && item.overview !== 'N/A' ? item.overview : "Synopsis parsing verified. Detailed overview will be available soon in database update.";

    let buttonsHtml = `<button class="tv-focusable bg-yellow-500 hover:bg-yellow-600 text-black px-6 py-3 rounded-lg text-xs font-black uppercase tracking-wider w-full sm:w-auto shadow-lg" tabindex="0" onclick="window.open('${item.url}', '_blank')">▶ Watch on ${plat.name}</button>`;
    
    if(plat.group === 'intl') {
        const appUrl = `https://moviebox.ph/web/searchResult?keyword=${encodeURIComponent(item.t)}`;
        buttonsHtml = `
            <button class="tv-focusable bg-yellow-500 hover:bg-yellow-600 text-black px-6 py-3 rounded-lg text-xs font-black uppercase tracking-wider w-full shadow-lg mb-2" tabindex="0" onclick="window.open('${appUrl}', '_blank')">🎬 Open in Moviebox</button>
            <button class="tv-focusable bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 px-6 py-3 rounded-lg text-xs font-black uppercase tracking-wider w-full" tabindex="0" onclick="window.open('${item.url}', '_blank')">🌐 Official Link</button>`;
    }

    modalCard.innerHTML = `
        <!-- Close Button for Modal -->
        <button class="tv-focusable absolute top-4 right-4 z-50 bg-black/60 hover:bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold" tabindex="0" onclick="closeModal()">✕</button>
        
        <!-- Image Half -->
        <div class="w-full md:w-2/5 h-64 md:h-auto relative">
            <img src="${imgSrc}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-r from-[#0c0f1d] to-transparent"></div>
        </div>
        
        <!-- Details Half -->
        <div class="w-full md:w-3/5 p-6 md:p-8 flex flex-col justify-center space-y-6">
            <div class="space-y-2">
                <span class="text-[9px] font-black px-2 py-0.5 rounded uppercase" style="background:${plat.color}; color:#000;">${plat.name}</span>
                <h2 class="text-3xl md:text-4xl font-black text-white tracking-wide leading-tight">${item.t}</h2>
                <div class="flex flex-wrap gap-2.5 items-center text-xs font-bold text-gray-400">
                    <span class="border border-gray-600 px-2 py-0.5 rounded text-[9px] text-white">HD</span>
                    <span>${item.safeYear}</span>
                    <span class="bg-yellow-500 text-black px-2 rounded font-black shadow">⭐ ${item.rating}</span>
                    <span class="text-white bg-slate-900 border border-slate-800 px-3 py-0.5 rounded-full text-[11px]">👁 ${item.views}</span>
                </div>
            </div>
            
            <div class="space-y-1.5 border-t border-white/5 pt-4">
                <span class="text-[10px] text-gray-500 font-black uppercase tracking-wider block">Synopsis:</span>
                <p class="text-gray-300 text-xs md:text-sm leading-relaxed font-light">${overview}</p>
            </div>
            
            <!-- Future Data Grid (Movieplex Style) -->
            <div class="bg-slate-900/40 p-4 rounded-xl border border-white/5 grid grid-cols-2 gap-3 text-[11px]">
                <div><span class="text-[9px] text-gray-500 block uppercase font-bold">Status</span><span class="text-gray-200 font-bold">${status}</span></div>
                <div><span class="text-[9px] text-gray-500 block uppercase font-bold">Country</span><span class="text-gray-200 font-bold">${country}</span></div>
                <div><span class="text-[9px] text-gray-500 block uppercase font-bold">Audio Track</span><span class="text-yellow-500 font-extrabold">${audioTrack}</span></div>
                <div><span class="text-[9px] text-gray-500 block uppercase font-bold">Runtime</span><span class="text-gray-200 font-bold">${runtime}</span></div>
            </div>
            
            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                ${buttonsHtml}
            </div>
        </div>
    `;

    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden'; // Stop background scrolling

    // Auto focus first button in modal for D-pad
    setTimeout(() => {
        const firstBtn = modalCard.querySelector('button');
        if(firstBtn) firstBtn.focus();
    }, 100);
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
}

// 🎮 TV D-PAD SPATIAL NAVIGATION CORE (THE ULTIMATE FIX)
function initTVNavigation() {
    document.addEventListener('keydown', (e) => {
        const allowedKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'];
        if (!allowedKeys.includes(e.key)) return;

        if (e.key === 'Escape') {
            closeModal();
            return;
        }

        const active = document.activeElement;
        
        // Handle 'Enter' press on focusable items
        if(e.key === 'Enter' && active.classList.contains('tv-focusable')) {
            e.preventDefault();
            active.click();
            return;
        }

        // Arrow Key Spatial Navigation
        if (e.key.startsWith('Arrow')) {
            e.preventDefault();
            
            // Get all visible focusable elements
            const focusables = Array.from(document.querySelectorAll('.tv-focusable:not([disabled])')).filter(el => {
                const rect = el.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && window.getComputedStyle(el).visibility !== 'hidden' && window.getComputedStyle(el).opacity !== '0';
            });
            
            if(focusables.length === 0) return;
            if(!active || !focusables.includes(active)) {
                focusables[0].focus();
                return;
            }

            const curRect = active.getBoundingClientRect();
            let bestMatch = null;
            let minDistance = Infinity;

            focusables.forEach(target => {
                if (target === active) return;
                const targetRect = target.getBoundingClientRect();
                let isDirectionalMatch = false;
                let dist = Infinity;

                // Determine if target is in the pressed direction
                if (e.key === 'ArrowRight' && targetRect.left >= curRect.right - 10) {
                    isDirectionalMatch = true;
                    dist = Math.hypot(targetRect.left - curRect.right, targetRect.top - curRect.top + (targetRect.height - curRect.height)/2);
                } else if (e.key === 'ArrowLeft' && targetRect.right <= curRect.left + 10) {
                    isDirectionalMatch = true;
                    dist = Math.hypot(curRect.left - targetRect.right, targetRect.top - curRect.top + (targetRect.height - curRect.height)/2);
                } else if (e.key === 'ArrowDown' && targetRect.top >= curRect.bottom - 10) {
                    isDirectionalMatch = true;
                    // For Up/Down, horizontal alignment matters more (giving X axis diff more weight)
                    const xDiff = (targetRect.left + targetRect.width/2) - (curRect.left + curRect.width/2);
                    const yDiff = targetRect.top - curRect.bottom;
                    dist = Math.hypot(xDiff * 2, yDiff); 
                } else if (e.key === 'ArrowUp' && targetRect.bottom <= curRect.top + 10) {
                    isDirectionalMatch = true;
                    const xDiff = (targetRect.left + targetRect.width/2) - (curRect.left + curRect.width/2);
                    const yDiff = curRect.top - targetRect.bottom;
                    dist = Math.hypot(xDiff * 2, yDiff);
                }

                if (isDirectionalMatch && dist < minDistance) {
                    minDistance = dist;
                    bestMatch = target;
                }
            });

            if (bestMatch) {
                bestMatch.focus();
                bestMatch.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }
        }
    });
}

// 🚀 Boot System
async function initApp(){
  try{
    const resp = await fetch('data.json', { cache: 'no-store' });
    if(!resp.ok) throw new Error();
    const rawItems = await resp.json();
    DATA = processData(rawItems);
    
    document.getElementById('db-total').innerText = DATA.length;
    renderFilters();
    renderLayout();
    initTVNavigation();
    
    // Auto focus for TV on load
    setTimeout(() => {
        const firstBtn = document.querySelector('.chip-focus.active');
        if(firstBtn) firstBtn.focus();
    }, 800);

  }catch(err){
    document.getElementById('rowsContainer').innerHTML = `<div class="text-center text-red-500 py-10 font-bold">Failed to load data. Ensure JSON exists.</div>`;
  }
}

// Stats Simulator
setInterval(() => {
    document.getElementById('count-active').innerText = Math.floor(Math.random() * (120 - 40 + 1)) + 40;
    document.getElementById('count-total').innerText = Math.floor(Math.random() * (800 - 300 + 1)) + 300;
}, 5000);

initApp();
</script>
