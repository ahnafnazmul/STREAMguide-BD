<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STREAMguide BD | First & #1 OTT Streaming Guide for Bangladesh</title>
<meta name="theme-color" content="#0c0f1d">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    body { background-color: #0c0f1d; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .scroller { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .scroller::-webkit-scrollbar { height: 4px; }
    .scroller::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.01); }
    .scroller::-webkit-scrollbar-thumb { background: rgba(234, 179, 8, 0.3); border-radius: 10px; }
    
    /* TV D-Pad Focus Styles */
    .tv-focusable { outline: none; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; border: 2px solid transparent; }
    .tv-focusable:focus { border-color: #eab308 !important; box-shadow: 0 0 20px rgba(234, 179, 8, 0.6) !important; transform: scale(1.08); z-index: 200; }
    .chip-focus:focus { transform: scale(1.05); border-color: #eab308 !important; background-color: #eab308 !important; color: #000 !important; }

    /* Updated STREAMguide BD Logo Styling (MovieflexBD Style) */
    .logo { font-size: 20px; letter-spacing: -0.03em; display: flex; align-items: center; font-weight: 900; }
    @media (min-width: 768px) { .logo { font-size: 24px; } }
    .logo span.stream { color: #eab308; } /* Yellow */
    .logo span.bd { color: #ffffff; margin-left: 4px; } /* White */

    /* 3D BACKGROUND CAROUSEL ENGINE (Compact Edition) */
    .carousel-container-fixed { position: relative; width: 100%; height: 280px; overflow: visible; background-color: #060814; margin-top: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    @media (min-width: 768px) { .carousel-container-fixed { height: 380px; } }
    .carousel-viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; perspective: 1200px; overflow: visible; z-index: 10; }
    .carousel-wheel-wrapper { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    
    .wheel-node { 
        position: absolute; width: 120px; height: 180px; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; border: 2px solid rgba(255,255,255,0.04); outline: none;
    }
    @media (min-width: 768px) { .wheel-node { width: 180px; height: 270px; border-radius: 16px; } }

    /* Compact Positioning */
    .wheel-node.active-center { transform: scale(1.05) translateZ(50px); z-index: 40; opacity: 1; border-color: rgba(234,179,8,0.6); }
    @media (min-width: 768px) { .wheel-node.active-center { transform: scale(1.1) translateX(60px) translateZ(80px); } }
    
    .wheel-node.side-L1 { transform: scale(0.9) translateX(-70px) translateZ(10px) rotateY(15deg); z-index: 30; opacity: 0.2; }
    .wheel-node.side-R1 { transform: scale(0.9) translateX(70px) translateZ(10px) rotateY(-15deg); z-index: 30; opacity: 0.7; }
    @media (min-width: 768px) {
        .wheel-node.side-L1 { transform: scale(0.95) translateX(-80px) translateZ(20px) rotateY(18deg); opacity: 0.3; }
        .wheel-node.side-R1 { transform: scale(0.95) translateX(240px) translateZ(20px) rotateY(-18deg); opacity: 0.8; }
    }
    
    .wheel-node.side-L2 { transform: scale(0.75) translateX(-130px) rotateY(25deg); z-index: 20; opacity: 0.05; }
    .wheel-node.side-R2 { transform: scale(0.75) translateX(130px) rotateY(-25deg); z-index: 20; opacity: 0.4; }
    @media (min-width: 768px) {
        .wheel-node.side-L2 { transform: scale(0.8) translateX(-220px) translateZ(-30px) rotateY(28deg); opacity: 0.1; }
        .wheel-node.side-R2 { transform: scale(0.8) translateX(400px) translateZ(-30px) rotateY(-28deg); opacity: 0.5; }
    }
    .wheel-node.invisible-loop { transform: scale(0.4) translateZ(-200px); z-index: 5; opacity: 0; pointer-events: none; }

    /* Fixed Metadata Pane - Ensuring it stays on top */
    #wheel-meta-pane { position: absolute; top: 2rem; left: 1rem; z-index: 100; max-width: 280px; text-align: left; pointer-events: auto; }
    @media (min-width: 768px) { #wheel-meta-pane { left: 3rem; max-width: 400px; top: 3rem; } }

    /* Modal Animation */
    .modal-overlay { position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(6,8,20,0.95); backdrop-filter: blur(10px); }
    .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease-out; }
    .modal-card { width: 100%; max-width: 900px; max-height: 85vh; background: #0c0f1d; border: 1px solid rgba(234,179,8,0.2); border-radius: 20px; overflow-y: auto; box-shadow: 0 30px 100px rgba(0,0,0,0.9); outline: none; }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    
    /* Custom Checkbox */
    input[type="checkbox"].platform-cb { accent-color: #eab308; width: 14px; height: 14px; cursor: pointer; }
</style>
</head>
<body class="relative min-h-screen pb-[120px] md:pb-[100px]">

    <!-- HEADER MENU BAR (Slimmer) -->
    <header class="w-full bg-[#060814]/95 backdrop-blur-md border-b border-white/5 sticky top-0 z-[150] px-4 md:px-12 py-2 flex items-center justify-between shadow-xl">
        <div class="brand cursor-pointer tv-focusable rounded p-1" onclick="window.location.reload()" tabindex="0">
            <div class="logo"><span class="stream">STREAMGUIDE</span><span class="bd">BD</span></div>
        </div>
        <div class="flex items-center gap-3">
            <div id="filters-container" class="hidden md:flex space-x-2"></div>
            
            <!-- Dynamic Platform Filter Dropdown -->
            <div class="relative">
                <button class="tv-focusable bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-[10px] md:text-xs font-black uppercase tracking-wider border border-slate-700 shadow flex items-center gap-1.5 transition" id="platform-filter-btn" tabindex="0">
                    ⚙️ Platforms
                </button>
                <div class="absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-700 rounded-lg shadow-2xl hidden flex-col p-2 z-[200]" id="platform-dropdown">
                    <div class="text-[9px] text-gray-500 font-bold uppercase mb-2 border-b border-white/10 pb-1 text-center">Manage Subscriptions</div>
                    <div id="dropdown-options" class="space-y-1 max-h-64 overflow-y-auto scroller">
                        <!-- Checkboxes injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MOBILE FILTERS ROW -->
    <div class="w-full bg-[#060814] border-b border-white/5 py-2 px-4 overflow-x-auto scroller flex md:hidden space-x-2" id="mobile-filters-container"></div>

    <!-- VIEW A: HOME VIEW -->
    <div id="home-view-container" class="block">
        <!-- 3D CAROUSEL -->
        <div class="carousel-container-fixed">
            <div id="wheel-meta-pane" class="space-y-3 md:space-y-4">
                <span class="bg-yellow-500 text-black text-[9px] font-black uppercase px-2 py-0.5 rounded shadow shadow-yellow-500/20" id="wheel-platform">FEATURED</span>
                <h2 id="wheel-title" class="text-xl md:text-4xl font-black text-white tracking-tight leading-none drop-shadow-lg">Loading...</h2>
                <div class="flex items-center space-x-3 text-[10px] md:text-xs font-bold text-gray-300">
                    <span id="wheel-year">--</span>
                    <span id="wheel-rating" class="text-yellow-500">⭐ --</span>
                    <span id="wheel-views">--</span>
                </div>
                <p id="wheel-desc" class="text-gray-400 text-[10px] md:text-sm leading-relaxed line-clamp-2 md:line-clamp-3 font-medium drop-shadow-md"></p>
                <button id="wheel-play-btn" class="tv-focusable bg-yellow-500 hover:bg-yellow-600 text-black font-black px-6 py-2 rounded-full text-[10px] md:text-xs tracking-wider uppercase shadow-xl mt-2" tabindex="0">
                    ▶ Details
                </button>
            </div>
            <div class="carousel-viewport"><div class="carousel-wheel-wrapper" id="carousel-wheel-core"></div></div>
            <div class="absolute bottom-0 left-0 w-full h-16 bg-gradient-to-t from-[#0c0f1d] to-transparent pointer-events-none z-30"></div>
        </div>

        <!-- DYNAMIC ROWS -->
        <div class="pl-4 md:pl-12 space-y-7 relative z-40 bg-[#0c0f1d] pt-6 pb-4" id="rowsContainer">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- MODAL DETAILS VIEW -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card tv-focusable flex flex-col md:flex-row relative" id="modalCard" tabindex="0">
            <!-- JS Inject Modal Content Here -->
        </div>
    </div>

    <!-- FIXED HUD PANEL -->
    <div class="fixed bottom-0 left-0 w-full z-[150] bg-[#060814]/95 backdrop-blur-md border-t border-white/10 shadow-[0_-10px_25px_rgba(0,0,0,0.95)] px-4 md:px-12 py-2.5 space-y-1 select-none">
        <div class="w-full flex justify-between items-center text-[9px] md:text-[10.5px] font-bold tracking-tight text-gray-400 uppercase">
            <div class="flex items-center space-x-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <p>ACTIVE: <span id="count-active" class="text-white font-extrabold ml-0.5">--</span></p>
                <span class="text-gray-800 text-[8px] mx-0.5">|</span>
                <p>TOTAL: <span id="count-total" class="text-white font-extrabold ml-0.5">--</span></p>
            </div>
            <div class="flex items-center space-x-1.5 text-right text-[8.5px] md:text-[10px]">
                <p>DATABASE: <span id="db-total" class="text-yellow-500 font-black ml-0.5">00</span></p>
            </div>
        </div>
        
        <div class="w-full flex justify-between items-center text-[8px] md:text-[9px] font-bold pt-1 border-t border-white/5">
            <div class="text-left text-gray-500 font-medium truncate max-w-[65%]">
                <span class="text-red-500 font-black uppercase mr-0.5">DISCLAIMER:</span>
                <span class="font-light text-gray-400">Does not host content. Aggregated APIs.</span>
            </div>
            <div class="text-right text-yellow-500 font-black tracking-wider text-[7.5px] md:text-[8.5px]">
                DEVELOPED BY @NAZMULSBLOG
            </div>
        </div>
    </div>

<script>
const PLATFORMS = {
  chorki:   { name:"Chorki",      color:"#e8482c", group:"local", package:"com.prothomalo.chorki" },
  bongo:    { name:"Bongo BD",    color:"#f2c14e", group:"local", package:"com.bongobd.bongo" },
  deepto:   { name:"Deepto Play", color:"#2ecc71", group:"local" },
  hoichoi:  { name:"Hoichoi",     color:"#f23557", group:"local", package:"com.viewlift.hoichoi" },
  bioscope: { name:"Bioscope",    color:"#2ea3f2", group:"local", package:"com.bengal.bioscope" },
  binge:    { name:"Binge",       color:"#00c2a8", group:"local", package:"com.sssl.binge" },
  toffee:   { name:"Toffee",      color:"#e0227a", group:"local", package:"com.banglalink.toffee" },
  netflix:  { name:"Netflix",     color:"#e50914", group:"intl", package:"com.netflix.mediaclient" },
  prime:    { name:"Prime Video", color:"#00a8e1", group:"intl" },
  zee5:     { name:"Zee5",        color:"#7b2ff7", group:"intl" },
  sonyliv:  { name:"SonyLIV",     color:"#1ba1e2", group:"intl" },
};
const CHIP_ORDER = ["all", "chorki", "hoichoi", "bongo", "bioscope", "toffee", "binge", "intl"];

let DATA = [];
let activeFilter = "all";
let wheelIndex = 0;
let wheelTimer = null;

// User's Platform Preferences (Local Storage)
let allowedPlatforms = JSON.parse(localStorage.getItem('userAllowedPlatforms'));
if (!allowedPlatforms) {
    allowedPlatforms = Object.keys(PLATFORMS); // Enable all by default
    localStorage.setItem('userAllowedPlatforms', JSON.stringify(allowedPlatforms));
}

function fmtDate(d){ return d.toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'}); }
function hashSeed(str){ let h = 0; for(let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) | 0; } return Math.abs(h); }
function fakeRatingFor(t){ return (5.5 + (hashSeed(t) % 35) / 10).toFixed(1); }
function fakeViewsFor(t){ const val = 500 + (hashSeed(t + 'views') % 49500); return val >= 1000 ? (val/1000).toFixed(1) + 'k' : String(val); }

// Formula 1: App Intent Launch
function triggerAppIntent(packageStr, webUrl) {
    if(!packageStr) {
        window.location.href = webUrl;
        return;
    }
    let cleanUrl = webUrl.replace(/^https?:\/\//, '');
    let intentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=${packageStr};end`;
    
    let iframe = document.createElement("iframe");
    iframe.style.display = "none";
    iframe.src = intentUrl;
    document.body.appendChild(iframe);
    setTimeout(() => document.body.removeChild(iframe), 1500);
}

function processData(rawItems){
  return rawItems.map((x, i) => {
    const date = new Date((x.releaseDate || x.native_date) + 'T00:00:00');
    const days = Math.max(0, Math.floor((Date.now() - date.getTime()) / 86400000));
    return {
      ...x, id: i, date, days,
      rating: x.rating || fakeRatingFor(x.t), views: fakeViewsFor(x.t),
      safeYear: date.getFullYear() || '----'
    };
  });
}

function initPlatformDropdown() {
    const btn = document.getElementById('platform-filter-btn');
    const menu = document.getElementById('platform-dropdown');
    const container = document.getElementById('dropdown-options');
    
    let html = '';
    Object.keys(PLATFORMS).forEach(k => {
        const isChecked = allowedPlatforms.includes(k) ? 'checked' : '';
        html += `
        <label class="flex items-center gap-2 p-2 hover:bg-slate-800 rounded cursor-pointer tv-focusable text-[10px] font-bold text-gray-200 transition" tabindex="0">
            <input type="checkbox" value="${k}" class="platform-cb rounded bg-slate-700 border-slate-600" ${isChecked}>
            ${PLATFORMS[k].name}
        </label>`;
    });
    container.innerHTML = html;

    btn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
    });

    document.querySelectorAll('.platform-cb').forEach(cb => {
        cb.addEventListener('change', (e) => {
            const val = e.target.value;
            if(e.target.checked) {
                if(!allowedPlatforms.includes(val)) allowedPlatforms.push(val);
            } else {
                allowedPlatforms = allowedPlatforms.filter(p => p !== val);
            }
            localStorage.setItem('userAllowedPlatforms', JSON.stringify(allowedPlatforms));
            renderLayout();
        });
    });
}

function renderFilters() {
  let html = `<button class="tv-focusable chip-focus active bg-yellow-500 text-black border border-yellow-500 px-4 py-1.5 rounded-full text-[10px] font-black uppercase transition shadow-lg" data-p="all" tabindex="0">Featured</button>`;
  
  CHIP_ORDER.slice(1).forEach(key => {
    if(key === "intl") {
      html += `<button class="tv-focusable chip-focus bg-slate-900 text-gray-400 border border-slate-800 px-4 py-1.5 rounded-full text-[10px] font-black uppercase transition" data-p="intl" tabindex="0">🌐 Intl</button>`;
    } else if(PLATFORMS[key]) {
      html += `<button class="tv-focusable chip-focus bg-slate-900 text-gray-400 border border-slate-800 px-4 py-1.5 rounded-full text-[10px] font-black uppercase transition" data-p="${key}" tabindex="0">${PLATFORMS[key].name}</button>`;
    }
  });

  const desktop = document.getElementById('filters-container');
  const mobile = document.getElementById('mobile-filters-container');
  if(desktop) desktop.innerHTML = html;
  if(mobile) mobile.innerHTML = html;

  document.querySelectorAll('.chip-focus').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip-focus').forEach(c => {
          c.classList.remove('bg-yellow-500', 'text-black', 'active', 'shadow-lg');
          c.classList.add('bg-slate-900', 'text-gray-400');
      });
      document.querySelectorAll(`[data-p="${chip.dataset.p}"]`).forEach(c => {
          c.classList.remove('bg-slate-900', 'text-gray-400');
          c.classList.add('bg-yellow-500', 'text-black', 'active', 'shadow-lg');
      });
      activeFilter = chip.dataset.p;
      renderLayout();
    });
  });
}

function build3DWheel(pool) {
    const wrapper = document.getElementById('carousel-wheel-core');
    wrapper.innerHTML = '';
    const safeSpotlight = pool.slice(0, 10);
    
    if(safeSpotlight.length === 0) {
        document.getElementById('wheel-title').innerText = "No Content";
        document.getElementById('wheel-desc').innerText = "Adjust platform filters to discover titles.";
        return;
    }
    
    safeSpotlight.forEach((movie, index) => {
        const node = document.createElement('div');
        node.className = "wheel-node invisible-loop tv-focusable";
        node.setAttribute('data-index', index);
        node.tabIndex = 0;
        node.innerHTML = `<img src="${movie.img && movie.img !== 'N/A' ? movie.img : 'https://placehold.co/300x450/1c1f2b/ffffff?text='+encodeURIComponent(movie.t)}" class="w-full h-full object-cover">`;
        
        node.onclick = () => {
            if(index === wheelIndex) openModal(movie);
            else { wheelIndex = index; rotateWheelLogic(safeSpotlight); }
        };
        wrapper.appendChild(node);
    });

    rotateWheelLogic(safeSpotlight);
    if(wheelTimer) clearInterval(wheelTimer);
    wheelTimer = setInterval(() => {
        wheelIndex = (wheelIndex + 1) % safeSpotlight.length;
        rotateWheelLogic(safeSpotlight);
    }, 7000);
}

function rotateWheelLogic(items) {
    const nodes = document.querySelectorAll('.wheel-node');
    if(nodes.length === 0) return;
    const total = nodes.length;

    nodes.forEach(node => {
        const idx = parseInt(node.getAttribute('data-index'));
        let diff = idx - wheelIndex;
        if (diff < -total / 2) diff += total;
        if (diff > total / 2) diff -= total;

        node.className = "wheel-node invisible-loop tv-focusable";
        if (diff === 0) {
            node.className = "wheel-node active-center tv-focusable";
            const movie = items[wheelIndex];
            if(movie) {
                const plat = PLATFORMS[movie.p] || {name: movie.p};
                document.getElementById('wheel-title').innerText = movie.t;
                document.getElementById('wheel-desc').innerText = (movie.overview && movie.overview !== "N/A") ? movie.overview : "Detailed overview and streaming links available. Click details to explore.";
                document.getElementById('wheel-year').innerText = movie.safeYear;
                document.getElementById('wheel-rating').innerText = `⭐ ${movie.rating}`;
                document.getElementById('wheel-views').innerText = `Views: ${movie.views}`;
                document.getElementById('wheel-platform').innerText = plat.name.toUpperCase();
                document.getElementById('wheel-play-btn').onclick = () => openModal(movie);
            }
        }
        else if (diff === -1) node.className = "wheel-node side-L1 tv-focusable";
        else if (diff === 1) node.className = "wheel-node side-R1 tv-focusable";
        else if (diff === -2) node.className = "wheel-node side-L2 tv-focusable";
        else if (diff === 2) node.className = "wheel-node side-R2 tv-focusable";
    });
}

function cardHTML(item) {
    const plat = PLATFORMS[item.p] || { name: item.p, color: "#eab308" };
    const imgSrc = item.img && item.img !== 'N/A' ? item.img : `https://placehold.co/300x450/1c1f2b/ffffff?text=${encodeURIComponent(item.t)}`;
    
    return `
    <div class="movie-card tv-focusable min-w-[110px] sm:min-w-[145px] bg-slate-900/40 rounded-xl overflow-hidden cursor-pointer relative shadow-xl flex-shrink-0 group border border-white/5" tabindex="0" data-id="${item.id}" onclick="openModalById(${item.id})">
        <div class="relative w-full pt-[142%] bg-slate-950">
            <img src="${imgSrc}" alt="${item.t}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
            <span class="absolute top-2 left-2 text-[8px] font-black px-1.5 py-0.5 rounded shadow-lg uppercase" style="background:${plat.color}; color:#000;">${plat.name}</span>
            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-[#0c0f1d] via-[#0c0f1d]/90 to-transparent p-2 pt-8">
                <h4 class="text-[10px] sm:text-[11px] font-bold truncate text-gray-100 group-hover:text-yellow-500 transition">${item.t}</h4>
                <div class="flex justify-between items-center mt-0.5 text-[8px] sm:text-[9px] text-gray-400 font-bold">
                    <span>${item.safeYear}</span>
                    <span class="text-yellow-500">⭐ ${item.rating}</span>
                </div>
            </div>
        </div>
    </div>`;
}

function renderLayout() {
    // 🔥 First Level Filter: User's Subscription Preferences
    let filteredByPlatform = DATA.filter(d => allowedPlatforms.includes(d.p));
    
    // 🔥 Second Level Filter: UI Chip Selection
    let pool = filteredByPlatform.filter(d => {
        const isIntl = PLATFORMS[d.p] && PLATFORMS[d.p].group === "intl";
        if(activeFilter === "all") return !isIntl;
        if(activeFilter === "intl") return isIntl;
        return d.p === activeFilter;
    });

    pool.sort((a,b) => a.days - b.days);
    
    if(wheelIndex >= Math.min(pool.length, 10)) wheelIndex = 0;
    build3DWheel(pool);

    const last7 = pool.filter(d => d.days <= 7);
    const d8to30 = pool.filter(d => d.days > 7 && d.days <= 30);
    const older = pool.filter(d => d.days > 30);

    const rowsEl = document.getElementById('rowsContainer');
    let html = '';
    
    if(last7.length){
        html += `<div class="space-y-2.5 row-scroll"><div class="flex justify-between items-center border-b border-white/5 pb-1 pr-4 md:pr-12"><h3 class="text-xs md:text-sm font-extrabold text-gray-200 flex items-center"><span class="w-1 h-3.5 bg-yellow-500 mr-2 rounded"></span>✨ New Releases</h3><span class="text-[10px] font-bold text-gray-400">${last7.length} Items</span></div><div class="flex space-x-3 overflow-x-auto scroller py-1.5 px-0.5">${last7.map(cardHTML).join('')}</div></div>`;
    }
    if(d8to30.length){
        html += `<div class="space-y-2.5 row-scroll"><div class="flex justify-between items-center border-b border-white/5 pb-1 pr-4 md:pr-12"><h3 class="text-xs md:text-sm font-extrabold text-gray-200 flex items-center"><span class="w-1 h-3.5 bg-blue-500 mr-2 rounded"></span>🎬 Recent (8-30 Days)</h3><span class="text-[10px] font-bold text-gray-400">${d8to30.length} Items</span></div><div class="flex space-x-3 overflow-x-auto scroller py-1.5 px-0.5">${d8to30.map(cardHTML).join('')}</div></div>`;
    }
    if(older.length){
        html += `<div class="space-y-2.5 row-scroll"><div class="flex justify-between items-center border-b border-white/5 pb-1 pr-4 md:pr-12"><h3 class="text-xs md:text-sm font-extrabold text-gray-200 flex items-center"><span class="w-1 h-3.5 bg-green-500 mr-2 rounded"></span>📚 Catalog</h3><span class="text-[10px] font-bold text-gray-400">${older.length} Items</span></div><div class="flex space-x-3 overflow-x-auto scroller py-1.5 px-0.5">${older.map(cardHTML).join('')}</div></div>`;
    }
    
    if(!pool.length) {
        html = `<div class="text-center text-gray-500 text-xs py-10 font-bold uppercase tracking-widest">No Content Found in this category</div>`;
    }
    
    rowsEl.innerHTML = html;
    fetchReviewsAndRender();
}

async function fetchReviewsAndRender() {
    try {
        const resp = await fetch('reviews.json', { cache: 'no-store' });
        if(!resp.ok) return;
        const reviews = await resp.json();
        
        // Filter reviews based on allowed platforms
        const validReviews = reviews.filter(review => {
            const matchedItem = DATA.find(d => d.t && d.t.trim().toLowerCase() === review.movie_name.trim().toLowerCase());
            return matchedItem && allowedPlatforms.includes(matchedItem.p);
        });

        if(validReviews.length === 0) return;

        const rowsEl = document.getElementById('rowsContainer');
        let html = `<div class="space-y-2.5 row-scroll mt-6">
            <div class="flex justify-between items-center border-b border-white/5 pb-1 pr-4 md:pr-12">
                <h3 class="text-xs md:text-sm font-extrabold text-gray-200 flex items-center">
                    <span class="w-1 h-3.5 bg-purple-500 mr-2 rounded"></span>📝 লেটেস্ট কন্টেন্ট রিভিউ
                </h3>
                <span class="text-[10px] font-bold text-gray-400">${validReviews.length} Reviews</span>
            </div>
            <div class="flex space-x-3 overflow-x-auto scroller py-1.5 px-0.5">`;
        
        validReviews.forEach(review => {
            const matchedItem = DATA.find(d => d.t && d.t.trim().toLowerCase() === review.movie_name.trim().toLowerCase());
            const autoImg = matchedItem && matchedItem.img && matchedItem.img !== 'N/A' ? matchedItem.img : 'https://placehold.co/300x450/1c1f2b/ffffff?text=' + encodeURIComponent(review.movie_name);
            const cid = matchedItem ? matchedItem.id : '';
            
            html += `
            <div class="movie-card tv-focusable min-w-[140px] sm:min-w-[170px] bg-slate-900/40 rounded-xl overflow-hidden cursor-pointer relative shadow-xl flex-shrink-0 group border border-white/5" tabindex="0" onclick="window.location.href='review.html?title=${encodeURIComponent(review.movie_name)}&cid=${cid}'">
                <div class="relative w-full pt-[142%] bg-slate-950">
                    <img src="${autoImg}" alt="${review.movie_name}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0c0f1d] via-[#0c0f1d]/90 to-transparent z-10"></div>
                    <div class="absolute bottom-0 left-0 w-full p-3 z-20">
                        <h4 class="text-[11px] sm:text-[12px] font-black leading-tight text-white group-hover:text-yellow-500 transition mb-1">${review.movie_name}</h4>
                        <div class="text-yellow-500 text-[9px] font-bold mb-1.5">⭐ রেটিং: ${review.rating}</div>
                        <p class="text-[9px] text-gray-300 line-clamp-3 leading-relaxed opacity-80">${review.review_text}</p>
                    </div>
                </div>
            </div>`;
        });
        
        html += `</div></div>`;
        rowsEl.insertAdjacentHTML('beforeend', html);
    } catch(e) { }
}

// 🎮 TV D-PAD SPATIAL NAVIGATION CORE (With Throttling)
let isNavigating = false;
function initTVNavigation() {
    document.addEventListener('keydown', (e) => {
        const allowedKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'];
        if (!allowedKeys.includes(e.key)) return;

        if (e.key === 'Escape') {
            const menu = document.getElementById('platform-dropdown');
            if(!menu.classList.contains('hidden')) { menu.classList.add('hidden'); return; }
            closeModal();
            return;
        }

        const active = document.activeElement;
        
        if(e.key === 'Enter' && active.classList.contains('tv-focusable')) {
            e.preventDefault();
            // Dropdown Toggle Logic
            if(active.id === 'platform-filter-btn') {
                document.getElementById('platform-dropdown').classList.toggle('hidden');
            } else if (active.tagName === 'LABEL') {
                const cb = active.querySelector('input[type="checkbox"]');
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change'));
            } else {
                active.click();
            }
            return;
        }

        if (e.key.startsWith('Arrow')) {
            e.preventDefault();
            if (isNavigating) return; // Throttling logic
            isNavigating = true;
            setTimeout(() => isNavigating = false, 120); // 120ms debounce

            const focusables = Array.from(document.querySelectorAll('.tv-focusable:not([disabled])')).filter(el => {
                const rect = el.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && window.getComputedStyle(el).visibility !== 'hidden' && window.getComputedStyle(el).opacity !== '0';
            });
            
            if(focusables.length === 0) return;
            if(!active || !focusables.includes(active)) {
                focusables[0].focus();
                return;
            }

            const curRect = active.getBoundingClientRect();
            let bestMatch = null;
            let minDistance = Infinity;

            focusables.forEach(target => {
                if (target === active) return;
                const targetRect = target.getBoundingClientRect();
                let isDirectionalMatch = false;
                let dist = Infinity;

                if (e.key === 'ArrowRight' && targetRect.left >= curRect.right - 15) {
                    isDirectionalMatch = true;
                    dist = Math.hypot(targetRect.left - curRect.right, targetRect.top - curRect.top);
                } else if (e.key === 'ArrowLeft' && targetRect.right <= curRect.left + 15) {
                    isDirectionalMatch = true;
                    dist = Math.hypot(curRect.left - targetRect.right, targetRect.top - curRect.top);
                } else if (e.key === 'ArrowDown' && targetRect.top >= curRect.bottom - 15) {
                    isDirectionalMatch = true;
                    dist = Math.hypot((targetRect.left - curRect.left)*2, targetRect.top - curRect.bottom); 
                } else if (e.key === 'ArrowUp' && targetRect.bottom <= curRect.top + 15) {
                    isDirectionalMatch = true;
                    dist = Math.hypot((targetRect.left - curRect.left)*2, curRect.top - targetRect.bottom);
                }

                if (isDirectionalMatch && dist < minDistance) {
                    minDistance = dist;
                    bestMatch = target;
                }
            });

            if (bestMatch) {
                bestMatch.focus();
                bestMatch.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }
        }
    });
}

// 🚀 Boot System & Deep Linking Engine
async function initApp(){
  try{
    const resp = await fetch('data.json', { cache: 'no-store' });
    if(!resp.ok) throw new Error();
    const rawItems = await resp.json();
    DATA = processData(rawItems);
    
    document.getElementById('db-total').innerText = DATA.length;
    initPlatformDropdown();
    renderFilters();
    renderLayout();
    initTVNavigation();
    
    // Deep Link Logic
    const urlParams = new URLSearchParams(window.location.search);
    const modalId = urlParams.get('modal') || urlParams.get('cid');
    
    if (modalId) {
        setTimeout(() => {
            openModalById(Number(modalId));
            window.history.replaceState({}, document.title, window.location.pathname);
        }, 600);
    } else {
        setTimeout(() => {
            const firstBtn = document.querySelector('.chip-focus.active');
            if(firstBtn) firstBtn.focus();
        }, 800);
    }

  }catch(err){
    document.getElementById('rowsContainer').innerHTML = `<div class="text-center text-red-500 py-10 font-bold">Failed to load data. Ensure JSON exists.</div>`;
  }
}

setInterval(() => {
    document.getElementById('count-active').innerText = Math.floor(Math.random() * (120 - 40 + 1)) + 40;
    document.getElementById('count-total').innerText = Math.floor(Math.random() * (800 - 300 + 1)) + 300;
}, 5000);

initApp();
</script>
