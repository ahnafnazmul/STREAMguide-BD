<style>
  :root{
    --bg: #090a0c; 
    --surface: #12141c; 
    --surface-2: #1c1f2b;
    --text: #ffffff; 
    --text-dim: #9ca3af;
    --marquee: #e8482c; 
    --gold: #ffc857; 
    --line: #262933;
    --focus-color: #00ffcc; /* Premium Neon Focus Glow */
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter','Hind Siliguri',sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:60px; overflow-x:hidden; }
  a{color:inherit; text-decoration:none;}

  /* 📢 Live Ticker */
  .ticker{ background: linear-gradient(90deg, #12141c, #220805); color:#fff; font-family:'Anton', sans-serif; letter-spacing:0.04em; font-size:14px; padding:8px 0; overflow:hidden; white-space:nowrap; border-bottom: 1px solid var(--line); }
  .ticker-track{ display:inline-block; padding-left:100%; animation: scroll-left 95s linear infinite; }
  .ticker-icon{ width:16px; height:16px; border-radius:4px; margin:0 6px 0 0; vertical-align:-3px; object-fit:contain; background:#fff; padding:1px; }
  .ticker-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:#22c55e; margin-left:6px; vertical-align:middle; box-shadow:0 0 5px 1px rgba(34,197,94,0.85); }
  .ticker-sep{ display:inline-block; margin:0 18px; color:rgba(255,255,255,0.25); }
  @keyframes scroll-left{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }

  /* 📺 Cinematic Header */
  header{ position:sticky; top:0; z-index:50; background:rgba(9,10,12,0.95); backdrop-filter:blur(15px); border-bottom:1px solid var(--line); }
  .header-inner{ max-width:1600px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:20px; }
  .brand{ min-width:0; flex:1 1 auto; }
  .tagline{font-size:14px; color:var(--text-dim); margin-top:2px; letter-spacing:0.03em;}
  .logo{ font-family:'Anton', sans-serif; font-size:30px; letter-spacing:-0.015em; display:flex; align-items:baseline; }
  .logo span.stream{color:var(--text); font-weight:900;}
  .logo span.guide-thin{color:var(--marquee); font-family:'Sacramento',cursive; font-weight:400; font-size:38px; margin-left:-4px;}
  .logo span.bd{color:var(--marquee); font-weight:900; margin-left:8px; -webkit-text-stroke:1.1px #fff;}
  
  .header-right{ flex:0 0 auto; display:flex; align-items:center; gap:12px; }
  .search-box{ display:flex; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px; width:240px; transition: all 0.2s; }
  .search-box:focus-within { border-color: var(--focus-color); box-shadow: 0 0 10px rgba(0,255,204,0.3); }
  .search-box input{ background:transparent; border:none; outline:none; color:var(--text); font-family:inherit; font-size:14px; width:100%; }
  .search-box svg{flex-shrink:0; opacity:0.6; width:16px; height:16px; color: var(--text); margin-right:6px;}
  
  .age-toggle{ display:flex; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; color:var(--text-dim); font-family:inherit; font-size:13px; font-weight:600; transition:all .18s ease; }
  .age-toggle:hover, .age-toggle:focus-visible{ color:var(--text); border-color: var(--focus-color); outline: none; }
  .age-toggle-track{ width:26px; height:15px; border-radius:999px; background:#3a3d45; position:relative; margin-left:8px; }
  .age-toggle-thumb{ position:absolute; top:2.5px; left:2px; width:10px; height:10px; border-radius:50%; background:#fff; transition:left .2s ease; }
  .age-toggle.on { color: var(--text); }
  .age-toggle.on .age-toggle-track{ background:var(--marquee); }
  .age-toggle.on .age-toggle-thumb{ left:14px; }

  /* 🏷️ Navigation Categories Chips */
  .filters{ max-width:1600px; margin:0 auto; display:flex; gap:10px; padding:10px 24px 16px; overflow-x:auto; scrollbar-width:none; }
  .filters::-webkit-scrollbar{display:none;}
  .chip{ flex-shrink:0; border:1px solid var(--line); background:var(--surface); color:var(--text-dim); font-size:14px; font-weight:600; padding:8px 18px; border-radius:999px; cursor:pointer; transition:all .18s ease; display:flex; align-items:center; }
  .chip:hover, .chip:focus-visible{ color:var(--text); border-color: var(--focus-color); transform: scale(1.05); outline: none;}
  .chip.active{ border-color: var(--focus-color); color:var(--text); background:var(--surface-2); font-weight:700; box-shadow: 0 0 12px rgba(0,255,204,0.2); }
  .chip-icon{ width:18px; height:18px; border-radius:4px; margin-right:8px; object-fit:contain; }

  /* 🎬 Endless Carousel Hero Banner */
  .hero{ max-width:1600px; margin:10px auto 10px; padding:0 24px; }
  .hero-carousel{ position:relative; }
  .hero-track{ display:flex; overflow-x:hidden; border-radius:18px; outline:none; border: 1px solid var(--line); position: relative; width: 100%; min-height: 420px; }
  .hero-card{ position:absolute; inset:0; width:100%; height:100%; opacity:0; visibility:hidden; transition: opacity 0.6s ease, visibility 0.6s ease; display:flex; align-items:center; padding:50px; 
    background: linear-gradient(90deg, rgba(9,10,12,1) 35%, rgba(9,10,12,0.6) 70%, rgba(9,10,12,0) 100%), var(--hero-grad); cursor:pointer; z-index: 1; }
  .hero-card.active { opacity:1; visibility:visible; z-index: 2; }
  .hero-card:focus-visible { transform: scale(1.01); box-shadow: 0 0 0 3px var(--focus-color); outline: none; }
  .hero-content { max-width: 650px; z-index: 3; }
  .hero-eyebrow{ font-family:'Anton', sans-serif; font-size:13px; letter-spacing:0.12em; color:var(--gold); margin-bottom:12px; text-transform: uppercase; }
  .hero-title{ font-family:'Anton', sans-serif; font-size:52px; letter-spacing:0.01em; line-height:1.1; margin-bottom:12px; color:#fff; }
  .hero-stars{ font-size:16px; color:#ffc857; margin-bottom:6px; }
  .hero-genre{ font-size:14px; color:var(--text-dim); margin-bottom:14px; }
  .hero-meta{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--text-dim); font-size:14px; margin-bottom:24px; }
  .badge{ font-size:12px; font-weight:700; padding:4px 12px; border-radius:6px; background:var(--dot); color:#000; }
  .hero-cta{ display:inline-flex; align-items:center; gap:8px; background:var(--marquee); color:#fff; font-weight:700; font-size:15px; padding:12px 26px; border-radius:8px; border:none; cursor:pointer; box-shadow: 0 4px 15px rgba(232,72,44,0.3); transition: 0.2s; }
  .hero-cta:hover, .hero-cta:focus-visible { background: #fff; color: #000; outline: none; transform: scale(1.05); }
  
  .hero-arrow{ position:absolute; top:50%; transform:translateY(-50%); z-index:10; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; background:rgba(18,20,28,0.7); color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; border: 1px solid var(--line); transition: 0.2s; }
  .hero-arrow:hover, .hero-arrow:focus-visible{ background:var(--focus-color); color:#000; outline: none; }
  .hero-arrow.prev{ left:16px; }
  .hero-arrow.next{ right:16px; }
  .hero-dots{ display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .hero-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); cursor:pointer; transition:all .15s ease; border:none; }
  .hero-dot.active{ background:var(--focus-color); width:24px; border-radius:4px; }

  /* 📺 Focused Rows Layout */
  .row-section{ max-width:1600px; margin:0 auto; padding:28px 24px 0; }
  .row-head{ display:flex; align-items:baseline; justify-content:between; margin-bottom:14px; }
  .row-title{ font-family:'Anton', sans-serif; font-size:22px; letter-spacing:0.02em; display:flex; align-items:center; gap:10px; }
  .row-title::before{ content:""; display:inline-block; width:5px; height:22px; border-radius:4px; background:var(--marquee); }
  .row-sub{font-size:14px; color:var(--text-dim); margin-left:10px;}
  .row-scroll{ display:flex; gap:18px; overflow-x:auto; padding:10px 4px 20px; scroll-snap-type:x proximity; }
  .row-scroll::-webkit-scrollbar{height:6px;}
  .row-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  /* 🃏 TV Card Zoom & Glow Effect */
  .card{ scroll-snap-align:start; flex:0 0 210px; cursor:pointer; outline:none; position:relative; border-radius:14px; overflow:hidden; transition:transform .2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow .2s ease, border-color .2s ease; background:var(--surface); border:1px solid var(--line); }
  .card:hover, .card:focus-visible, .card.tv-focus{ 
    transform: scale(1.08) translateY(-5px); 
    box-shadow: 0 10px 25px rgba(0, 255, 204, 0.25), 0 0 15px 2px var(--focus-color);
    border-color: var(--focus-color);
    z-index: 10;
  }
  
  .card .poster{ height:290px; width:100%; background:var(--grad); display:flex; align-items:flex-end; padding:14px; position:relative; }
  .card .poster-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; transition: transform 0.3s; }
  .card:hover .poster-img, .card:focus-visible .poster-img { transform: scale(1.05); }
  .card .poster-img.adult-blur{ filter:blur(28px) saturate(1.2); transform:scale(1.15); }
  
  .adult-shield{ position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:rgba(9,10,12,0.7); color:#fff; text-align:center; padding:12px; }
  .adult-shield svg{ width:26px; height:26px; color: var(--marquee); }
  .adult-shield span{ font-size:12px; font-weight:700; }
  
  .card .poster::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 50%, rgba(9,10,12,0.95) 100%); z-index: 1; }
  .card .poster-title{ position:relative; z-index:2; font-family:'Anton', sans-serif; font-size:18px; line-height:1.2; color:#fff; }
  .card .platform-tag{ position:absolute; top:10px; left:10px; z-index:2; font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px; background:var(--dot); color:#000; }
  .card .new-tag{ position:absolute; top:10px; right:10px; z-index:2; font-size:10px; font-weight:700; padding:4px 8px; border-radius:6px; background:#fff; color:#000; }
  
  .card-info{ padding:12px; font-size:13px; color:var(--text-dim); display:flex; flex-direction:column; gap:4px; background: var(--surface); position: relative; z-index: 2; }
  .card-info .cname{ color:var(--text); font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fake-rating{ color:var(--gold); font-weight:700; }
  .card .overlay{ position:absolute; inset:0; z-index:3; background:rgba(9,10,12,0.95); padding:16px; display:flex; flex-direction:column; justify-content:flex-end; opacity:0; transition:opacity .2s ease; pointer-events:none; }

  .empty-state{ max-width:1600px; margin:0 auto; padding:80px 24px; text-align:center; color:var(--text-dim); font-size:18px; }

  /* 🍿 Premium Theater Style Detail Popup Modal */
  .modal-overlay{ position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:24px; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
  .modal-overlay.open{ display:flex; }
  .modal-card{ position:relative; width:100%; max-width:960px; max-height:85vh; background:var(--surface); border:2px solid var(--line); border-radius:20px; display:flex; overflow:hidden; box-shadow:0 30px 100px rgba(0,0,0,0.8); animation: modal-in .25s cubic-bezier(0.075, 0.82, 0.165, 1); }
  @keyframes modal-in{ from{opacity:0; transform:scale(.95);} to{opacity:1; transform:scale(1);} }
  .modal-close{ position:absolute; top:16px; right:16px; z-index:5; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; background:rgba(9,10,13,0.8); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; transition: 0.2s; }
  .modal-close:hover, .modal-close:focus-visible { background: var(--marquee); outline: none; }
  .modal-image{ flex:0 0 45%; background-size:cover; background-position:center; position:relative; }
  .modal-image::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent 50%, var(--surface) 100%); }
  .modal-details{ flex:1; padding:36px; overflow-y:auto; }
  .modal-platform-badge{ display:inline-block; font-size:12px; font-weight:700; padding:5px 14px; border-radius:6px; background:var(--dot); color:#000; margin-bottom:16px; }
  .modal-title{ font-family:'Anton', sans-serif; font-size:36px; line-height:1.1; margin-bottom:16px; color: #fff; }
  
  .modal-meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 24px; font-size:14px; color:var(--text-dim); margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--line); }
  .modal-meta-grid .label{ color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:2px; }
  .modal-meta-grid .value{ color:var(--text); font-size:15px; font-weight:600; }
  .modal-synopsis-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-dim); margin-bottom:6px; }
  .modal-synopsis{ font-size:15px; line-height:1.6; color:#e5e7eb; margin-bottom:26px; }
  
  .modal-cta{ display:inline-flex; align-items:center; gap:10px; background:var(--marquee); color:#fff; font-weight:700; font-size:16px; padding:14px 28px; border-radius:10px; border:none; cursor:pointer; width:100%; justify-content:center; box-shadow: 0 4px 15px rgba(232,72,44,0.3); transition: 0.2s; }
  .modal-cta:hover, .modal-cta:focus-visible{ background:#fff; color:#000; outline: none; transform: scale(1.02); }
  .modal-cta.manual{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); }
  
  /* 🍿 Special Golden Moviebox App Trigger Button */
  .modal-cta.moviebox-btn {
    background: linear-gradient(135deg, #ffc857, #c9860a);
    color: #000;
    font-weight: 800;
    border: none;
    margin-top: 8px;
  }
  .modal-cta.moviebox-btn:hover, .modal-cta.moviebox-btn:focus-visible {
    background: #fff;
    color: #000;
    box-shadow: 0 0 15px var(--gold);
  }

  footer{ max-width:1600px; margin:50px auto 0; padding:24px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; font-size:14px; color:var(--text-dim); }
  footer .dev-credit{color:var(--gold); font-weight:600;}
  .disclaimer{ max-width:1600px; margin:40px auto 0; padding:16px 24px; font-size:13px; color:var(--text-dim); text-align:center; border-top:1px solid var(--line); }
  .disclaimer-label{ color:var(--marquee); font-weight:900; font-size:16px; }

  @media (min-width:1600px){
    .header-inner, .filters, .hero, .row-section, footer, .disclaimer{ max-width:1800px; }
    .hero-card { min-height: 480px; }
    .hero-title { font-size: 64px; }
    .card { flex: 0 0 240px; }
    .card .poster { height: 330px; }
  }
</style>
</head>

function hashSeed(str){ let h = 0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; } return Math.abs(h); }
function fakeRatingFor(t, p){ return (3.5 + (hashSeed(t + p) % 16) / 10).toFixed(1); }
function fakeViewsFor(t, p){ const val = 500 + (hashSeed(p + t + 'views') % 49500); return val >= 1000 ? (val/1000).toFixed(1) + 'k' : String(val); }

const DATA = TITLES.map((x,i)=>({
  ...x, id:i, date: daysAgo(x.days), grad: GRADIENTS[i % GRADIENTS.length],
  fakeRating: fakeRatingFor(x.t, x.p), fakeViews: fakeViewsFor(x.t, x.p), fakeGenre: "Cinematic Mix",
  url: x.url || "#"
}));

(function mergeDuplicateTitles(){
  const firstByTitle = new Map();
  DATA.forEach(item=>{
    if(PLATFORMS[item.p].group !== "intl") return;
    const key = item.t.trim().toLowerCase();
    if(firstByTitle.has(key)){
      const first = firstByTitle.get(key);
      if(!first.platforms) first.platforms = [first.p];
      if(!first.platforms.includes(item.p)) first.platforms.push(item.p);
      item.merged = true;
    } else {
      firstByTitle.set(key, item);
    }
  });
})();

function renderFilters(){
  const filtersEl = document.getElementById('filters');
  let html = `<button class="chip active" data-p="all" tabindex="0"><svg class="chip-icon" viewBox="0 0 24 24" fill="none" style="background:transparent; width:16px; height:16px; margin-right:6px;"><path d="M12 2l2.2 6.8H21l-5.6 4.1 2.1 6.9L12 15.8 6.5 19.8l2.1-6.9L3 8.8h6.8z" fill="#ffc857"/></svg>Home Featured</button>`;
  CHIP_ORDER.slice(1).forEach(key=>{
    if(key === "intl") {
      html += `<button class="chip" data-p="intl" style="--dot:#7d5fff" tabindex="0">🌐 International</button>`;
    } else {
      const plat = PLATFORMS[key];
      html += `<button class="chip" data-p="${key}" style="--dot:${plat.color}" tabindex="0">${plat.name}</button>`;
    }
  });
  filtersEl.innerHTML = html;
  filtersEl.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      filtersEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.p;
      render();
    });
  });
}

    <div class="poster">
      ${item.img ? `<img class="poster-img${blurred ? ' adult-blur' : ''}" src="${item.img}" loading="lazy" alt="${item.t}">` : ''}
      ${blurred ? `<div class="adult-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>18+ Content</span></div>` : ''}
      <span class="platform-tag">${tagLabel}</span>
      ${item.days <= 7 ? '<span class="new-tag">NEW</span>' : ''}
      <div class="poster-title">${item.t}</div>
    </div>
    <div class="card-info">
      <div class="cname">${item.t}</div>
      <div class="meta-line">★ ${item.fakeRating} • 👁 ${item.fakeViews}</div>
    </div>
  </div>`;
}

function heroSlideHTML(item, index){
  const plat = PLATFORMS[item.p];
  const heroBg = item.img ? `linear-gradient(90deg, rgba(9,10,12,1) 40%, rgba(9,10,12,0.4) 70%, rgba(9,10,12,0) 100%), url('${item.img}')` : null;
  return `
    <div class="hero-card ${index === 0 ? 'active' : ''}" data-id="${item.id}" style="--hero-grad:${item.grad}; ${heroBg ? `background-image:${heroBg}; background-size:cover; background-position:right center;` : ''}">
      <div class="hero-content">
        <div class="hero-eyebrow">STREAMGUIDE FEATURED</div>
        <div class="hero-title">${item.t}</div>
        <div class="hero-stars">★★★★☆ <span style="color:#fff; font-size:14px; margin-left:6px;">${item.fakeRating}</span></div>
        <div class="hero-meta"><span class="badge" style="--dot:${plat.color}">${plat.name}</span><span>${fmtDate(item.date)}</span></div>
        <button class="hero-cta" onclick="event.stopPropagation(); openModal(${item.id});" tabindex="0">▶ Watch Details</button>
      </div>
    </div>`;
}

let heroAutoplayTimer = null;
const HERO_AUTOPLAY_MS = 6000; 

function renderHero(list){
  const heroEl = document.getElementById('heroSection');
  if(heroAutoplayTimer){ clearInterval(heroAutoplayTimer); heroAutoplayTimer = null; }
  if(!list.length){ heroEl.innerHTML = ''; return; }
  
  const pool = list.filter(d => PLATFORMS[d.p].group !== 'intl');
  if(!pool.length){ heroEl.innerHTML = ''; return; }
  
  const displaySlides = pool.slice(0, 5); 

  heroEl.innerHTML = `
    <div class="hero-carousel">
      <button class="hero-arrow prev" aria-label="Previous">‹</button>
      <div class="hero-track" id="heroTrack">
        ${displaySlides.map((item, idx) => heroSlideHTML(item, idx)).join('')}
      </div>
      <button class="hero-arrow next" aria-label="Next">›</button>
    </div>
    <div class="hero-dots" id="heroDots">
      ${displaySlides.map((_, i) => `<button class="hero-dot ${i===0?'active':''}" data-i="${i}"></button>`).join('')}
    </div>`;

  const cards = heroEl.querySelectorAll('.hero-card');
  const dots = heroEl.querySelectorAll('.hero-dot');
  let currentIdx = 0;

  const showSlide = (newIdx) => {
    // Endless Repeat Loop Logic
    if (newIdx >= displaySlides.length) newIdx = 0;
    if (newIdx < 0) newIdx = displaySlides.length - 1;
    
    cards.forEach((c, i) => c.classList.toggle('active', i === newIdx));
    dots.forEach((d, i) => d.classList.toggle('active', i === newIdx));
    currentIdx = newIdx;
  };

  heroEl.querySelector('.hero-arrow.prev').addEventListener('click', () => showSlide(currentIdx - 1));
  heroEl.querySelector('.hero-arrow.next').addEventListener('click', () => showSlide(currentIdx + 1));
  
  dots.forEach(d => {
    d.addEventListener('click', () => showSlide(Number(d.dataset.i)));
  });

  // Smooth Endless Auto-Scrolling Interval
  heroAutoplayTimer = setInterval(() => {
    showSlide(currentIdx + 1);
  }, HERO_AUTOPLAY_MS);
}

function render(){
  const rows = document.getElementById('rowsContainer');
  let pool = DATA.filter(d=>{
    if(d.merged) return false;
    if(activeFilter === "all"){
      if(!show18Plus && PLATFORMS[d.p].group === "intl") return false;
      return true;
    }
    if(activeFilter === "intl") return PLATFORMS[d.p].group === "intl";
    return d.p === activeFilter;
  });

  if(searchQuery) pool = pool.filter(d => d.t.toLowerCase().includes(searchQuery.toLowerCase()));
  pool.sort((a,b)=> a.days - b.days);

  renderHero(pool);

  // Filtered into two requested focus rows
  const last7 = pool.filter(d => d.days <= 7);
  const d8to30 = pool.filter(d => d.days > 7 && d.days <= 30);

  let html = '';
  if(last7.length){
    html += `<div class="row-section"><div class="row-head"><div class="row-title">New Releases (Last 7 Days)</div><div class="row-sub">${last7.length} Items Available</div></div><div class="row-scroll">${last7.map(cardHTML).join('')}</div></div>`;
  }
  if(d8to30.length){
    html += `<div class="row-section"><div class="row-head"><div class="row-title">Recent Releases (8–30 Days)</div><div class="row-sub">${d8to30.length} Items Available</div></div><div class="row-scroll">${d8to30.map(cardHTML).join('')}</div></div>`;
  }
  if(!last7.length && !d8to30.length){
    html = `<div class="empty-state">No matching titles found within the featured timeframe. Please shift categories.</div>`;
  }
  rows.innerHTML = html;

  rows.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openModal(Number(c.dataset.id)));
  });
}

function openModal(id){
  const item = DATA.find(d => d.id === id);
  if(!item) return;
  const plat = PLATFORMS[item.p];
  const isInternational = plat.group === "intl" || item.platforms?.some(p => PLATFORMS[p].group === "intl");
  
  const overlay = document.getElementById('modalOverlay');
  
  // 🍿 Certified Moviebox Android App Deep Link Redirect URL 
  const encodedTitle = encodeURIComponent(item.t);
  const movieboxAppUrl = `https://moviebox.ph/web/searchResult?keyword=${encodedTitle}`;

  let actionButtons = '';
  if(isInternational) {
    actionButtons += `<button class="modal-cta moviebox-btn" onclick="window.open('${movieboxAppUrl}','_blank')" tabindex="0">🎬 Open in Moviebox Premium (App)</button>`;
    actionButtons += `<button class="modal-cta manual" style="margin-top:10px;" onclick="window.open('${item.url}','_blank')" tabindex="0">Official Streaming Link</button>`;
  } else {
    actionButtons += `<button class="modal-cta" onclick="window.open('${item.url}','_blank')" tabindex="0">▶ Watch on ${plat.name} Network</button>`;
  }

  overlay.innerHTML = `
    <div class="modal-card">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-image" style="background-image:url('${item.img || ''}'); background-color:var(--surface-2);"></div>
      <div class="modal-details">
        <span class="modal-platform-badge" style="background:${plat.color}">${plat.name}</span>
        <div class="modal-title">${item.t}</div>
        <div class="modal-meta-grid">
          <div><div class="label">Runtime</div><div class="value">${item.dur || 'N/A'}</div></div>
          <div><div class="label">IMDb Score</div><div class="value">★ ${item.fakeRating}</div></div>
          <div><div class="label">Genre</div><div class="value">Cinematic Mix</div></div>
          <div><div class="label">Total Views</div><div class="value">👁 ${item.fakeViews}</div></div>
        </div>
        <div class="modal-synopsis-label">Synopsis / Briefing</div>
        <div class="modal-synopsis">${item.synopsis || 'Detailed storyline information for this title will be available soon. Stay tuned with STREAMguide BD.'}</div>
        ${actionButtons}
      </div>
    </div>`;

  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ⌨️ Perfect TV D-Pad Focus Navigation Engine 
document.addEventListener('keydown', (e)=>{
  const focused = document.activeElement;
  if (!focused) return;
  
  if (focused.classList.contains('card')) {
    const currentRow = focused.closest('.row-scroll');
    if (!currentRow) return;
    const cards = Array.from(currentRow.querySelectorAll('.card'));
    const idx = cards.indexOf(focused);
    const allRows = Array.from(document.querySelectorAll('.row-scroll'));
    const rowIdx = allRows.indexOf(currentRow);

    if (e.key === 'ArrowRight' && idx < cards.length - 1) {
      e.preventDefault(); cards[idx+1].focus();
    } else if (e.key === 'ArrowLeft' && idx > 0) {
      e.preventDefault(); cards[idx-1].focus();
    } else if (e.key === 'ArrowDown' && rowIdx < allRows.length - 1) {
      e.preventDefault();
      const nextCards = Array.from(allRows[rowIdx+1].querySelectorAll('.card'));
      (nextCards[Math.min(idx, nextCards.length-1)] || nextCards[0]).focus();
    } else if (e.key === 'ArrowUp' && rowIdx > 0) {
      e.preventDefault();
      const prevCards = Array.from(allRows[rowIdx-1].querySelectorAll('.card'));
      (prevCards[Math.min(idx, prevCards.length-1)] || prevCards[0]).focus();
    } else if (e.key === 'Enter') {
      focused.click();
    }
  }
});

document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery = e.target.value; render(); });
document.getElementById('ageToggle').addEventListener('click', ()=>{
  show18Plus = !show18Plus;
  document.getElementById('ageToggle').classList.toggle('on', show18Plus);
  render();
});

  const el = document.getElementById('visitorStats');
  if(!el) return;
  el.textContent = "Today Visitors: 58 • Active Viewers: 14 • Total Visitors: 843";
})();

renderFilters();
render();
</script>
