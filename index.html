const CHIP_ORDER = ["all","chorki","bongo","deepto","iscreen","hoichoi","bioscope","utsob","binge","toffee","intl"];
const GRADIENTS = ["linear-gradient(160deg,#231111,#090a0c)", "linear-gradient(160deg,#111a24,#090a0c)", "linear-gradient(160deg,#1a1026,#090a0c)"];

function fmtDate(d){ return d.toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'}); }
function hashSeed(str){ let h = 0; for(let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) | 0; } return Math.abs(h); }
function fakeRatingFor(t, p){ return (3.5 + (hashSeed(t + p) % 16) / 10).toFixed(1); }
function fakeViewsFor(t, p){ const val = 500 + (hashSeed(p + t + 'views') % 49500); return val >= 1000 ? (val/1000).toFixed(1) + 'k' : String(val); }

let DATA = [];

function buildData(rawItems){
  return rawItems.map((x,i)=>{
    const date = new Date(x.releaseDate + 'T00:00:00');
    const days = Math.max(0, Math.floor((Date.now() - date.getTime()) / 86400000));
    return {
      ...x, id:i, date, days, grad: GRADIENTS[i % GRADIENTS.length],
      fakeRating: fakeRatingFor(x.t, x.p), fakeViews: fakeViewsFor(x.t, x.p), fakeGenre: "Cinematic Mix",
      url: x.url || ((PLATFORMS[x.p] && PLATFORMS[x.p].base !== "#" && x.slug) ? PLATFORMS[x.p].base + x.slug : (PLATFORMS[x.p]?.base || "#"))
    };
  });
}

function mergeDuplicateTitles(){
  const firstByTitle = new Map();
  DATA.forEach(item => {
    if(PLATFORMS[item.p] && PLATFORMS[item.p].group !== "intl") return;
    const key = item.t.trim().toLowerCase();
    if(firstByTitle.has(key)){
      const first = firstByTitle.get(key);
      if(!first.platforms) first.platforms = [first.p];
      if(!first.platforms.includes(item.p)) first.platforms.push(item.p);
      item.merged = true;
    } else {
      firstByTitle.set(key, item);
    }
  });
}

let activeFilter = "all";
let searchQuery = "";
let show18Plus = false;

const NSFW_THRESHOLD = 0.55; 
const nsfwCache = new Map(); 
let nsfwModelPromise = null;

function loadNSFWModel(){
  if(!nsfwModelPromise){
    nsfwModelPromise = (async () => {
      if(!window.__nsfwjs) return null;
      try { return await window.__nsfwjs.load(); } catch(err){ return null; }
    })();
  }
  return nsfwModelPromise;
}

async function checkImageNSFW(url){
  if(!url) return false;
  if(nsfwCache.has(url)) return nsfwCache.get(url);
  try{
    const model = await loadNSFWModel();
    if(!model) return false;
    const img = new Image(); img.crossOrigin = 'anonymous';
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
    const predictions = await model.classify(img);
    const score = predictions.filter(p => p.className === 'Porn' || p.className === 'Hentai' || p.className === 'Sexy').reduce((sum, p) => sum + p.probability, 0);
    const flagged = score >= NSFW_THRESHOLD;
    nsfwCache.set(url, flagged);
    return flagged;
  }catch(err){ nsfwCache.set(url, false); return false; }
}

function applyAdultBlurToCard(card){
  const img = card.querySelector('.poster-img');
  const poster = card.querySelector('.poster');
  if(img) img.classList.add('adult-blur');
  if(poster && !poster.querySelector('.adult-shield')){
    poster.insertAdjacentHTML('beforeend', `<div class="adult-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>18+ Content</span></div>`);
  }
}

let cardObserver = null;
function observeCardsForNSFW(){
  if(!window.__nsfwjs) return; 
  if(cardObserver) cardObserver.disconnect();
  cardObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(!entry.isIntersecting) return;
      const card = entry.target;
      cardObserver.unobserve(card);
      const id = Number(card.dataset.id);
      const item = DATA.find(d => d.id === id);
      if(!item || !item.img || item.adult || item.autoAdult || item.userFlag === 'safe') return;
      checkImageNSFW(item.img).then(flagged => {
        if(flagged && item.userFlag !== 'safe'){
          item.autoAdult = true;
          if(!show18Plus) applyAdultBlurToCard(card);
        }
      });
    });
  }, { rootMargin: '250px' });
  document.querySelectorAll('.card[data-id]').forEach(c => cardObserver.observe(c));
}

let heroAutoplayTimer = null;
const HERO_AUTOPLAY_MS = 6000; 

function renderHero(list){
  const heroEl = document.getElementById('heroSection');
  if(!heroEl) return;
  if(heroAutoplayTimer){ clearInterval(heroAutoplayTimer); heroAutoplayTimer = null; }
  
  const pool = list.filter(d => PLATFORMS[d.p] && PLATFORMS[d.p].group !== 'intl');
  if(!pool.length){ heroEl.innerHTML = ''; return; }
  
  const displaySlides = pool.slice(0, 6); 

  heroEl.innerHTML = `
    <div class="hero-carousel">
      <button class="hero-arrow prev" tabindex="-1" aria-label="Previous">‹</button>
      <div class="hero-track" id="heroTrack">
        ${displaySlides.map((item, idx) => heroSlideHTML(item, idx)).join('')}
      </div>
      <button class="hero-arrow next" tabindex="-1" aria-label="Next">›</button>
    </div>
    <div class="hero-dots" id="heroDots">
      ${displaySlides.map((_, i) => `<button class="hero-dot ${i===0?'active':''}" tabindex="-1" data-i="${i}"></button>`).join('')}
    </div>`;

  const cards = heroEl.querySelectorAll('.hero-card');
  const dots = heroEl.querySelectorAll('.hero-dot');
  let currentIdx = 0;

  const showSlide = (newIdx) => {
    if (newIdx >= displaySlides.length) newIdx = 0;
    if (newIdx < 0) newIdx = displaySlides.length - 1;
    cards.forEach((c, i) => c.classList.toggle('active', i === newIdx));
    dots.forEach((d, i) => d.classList.toggle('active', i === newIdx));
    currentIdx = newIdx;
  };

  heroEl.querySelector('.hero-arrow.prev').addEventListener('click', () => showSlide(currentIdx - 1));
  heroEl.querySelector('.hero-arrow.next').addEventListener('click', () => showSlide(currentIdx + 1));
  dots.forEach(d => { d.addEventListener('click', () => showSlide(Number(d.dataset.i))); });

  cards.forEach(c => {
    c.addEventListener('click', () => openModal(Number(c.dataset.id)));
    c.addEventListener('keydown', (e) => { if(e.key === 'Enter') c.click(); });
  });

  heroAutoplayTimer = setInterval(() => { showSlide(currentIdx + 1); }, HERO_AUTOPLAY_MS);
}

function render(){
  const rows = document.getElementById('rowsContainer');
  if(!rows) return;
  
  let pool = DATA.filter(d => {
    if(d.merged) return false;
    const isIntl = PLATFORMS[d.p] && PLATFORMS[d.p].group === "intl";
    if(activeFilter === "all") return show18Plus ? true : !isIntl;
    if(activeFilter === "intl") return isIntl;
    return d.p === activeFilter;
  });

  if(searchQuery) {
    const q = searchQuery.toLowerCase();
    pool = pool.filter(d => d.t.toLowerCase().includes(q));
  }
  pool.sort((a,b) => a.days - b.days);

  renderHero(show18Plus ? pool : pool.filter(d => d.userFlag === 'safe' || (!d.adult && !d.autoAdult && d.userFlag !== 'flag')));

  const last7 = pool.filter(d => d.days <= 7);
  const d8to30 = pool.filter(d => d.days > 7 && d.days <= 30);
  const older = pool.filter(d => d.days > 30);

  let html = '';
  if(last7.length){
    html += `<div class="row-section"><div class="row-head"><div class="row-title">New Releases (Last 7 Days)</div><div class="row-sub">${last7.length} Items</div></div><div class="row-scroll">${last7.map(cardHTML).join('')}</div></div>`;
  }

  }
  if(older.length){
    html += `<div class="row-section"><div class="row-head"><div class="row-title">More Content</div><div class="row-sub">${older.length} Items</div></div><div class="row-scroll">${older.map(cardHTML).join('')}</div></div>`;

  if(!pool.length){
    html = `<div class="empty-state">No matching titles found within the featured timeframe. Please try shifting categories.</div>`;
  }
  rows.innerHTML = html;

  rows.querySelectorAll('.card').forEach(c => {

  observeCardsForNSFW();
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') { closeModal(); return; }
  
  const focused = document.activeElement;
  if (!focused || !focused.classList.contains('card')) return;
  
  const currentRow = focused.closest('.row-scroll');
  if (!currentRow) return;
  const cards = Array.from(currentRow.querySelectorAll('.card'));
  const idx = cards.indexOf(focused);
  const allRows = Array.from(document.querySelectorAll('.row-scroll'));
  const rowIdx = allRows.indexOf(currentRow);

  if (e.key === 'ArrowRight' && idx < cards.length - 1) {
    e.preventDefault(); cards[idx+1].focus(); cards[idx+1].scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  } else if (e.key === 'ArrowLeft' && idx > 0) {
    e.preventDefault(); cards[idx-1].focus(); cards[idx-1].scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
  } else if (e.key === 'ArrowDown' && rowIdx < allRows.length - 1) {
    e.preventDefault();
    const nextCards = Array.from(allRows[rowIdx+1].querySelectorAll('.card'));
    (nextCards[Math.min(idx, nextCards.length-1)] || nextCards[0]).focus();
  } else if (e.key === 'ArrowUp' && rowIdx > 0) {
    e.preventDefault();
    const prevCards = Array.from(allRows[rowIdx-1].querySelectorAll('.card'));
    (prevCards[Math.min(idx, prevCards.length-1)] || prevCards[0]).focus();
  } else if (e.key === 'Enter') {
    focused.click();
  }
});

            `;
            container.appendChild(card);
        });
    } catch(e) {
        console.error("রিভিউ লোড হতে সমস্যা হচ্ছে:", e);
    }
}

async function initApp(){
  const rowsEl = document.getElementById('rowsContainer');
  rowsEl.innerHTML = `<div class="empty-state">Loading Premium Content...</div>`;
  try{
    const resp = await fetch('data.json', { cache: 'no-store' });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const rawItems = await resp.json();
    DATA = buildData(rawItems);
    mergeDuplicateTitles();
    applyContentFlags();
    renderFilters();
    renderTicker();
    render();
    
    // মেইন ডেটা লোড হওয়ার পরেই আমরা রিভিউগুলো ফেচ করব
    await fetchReviewsAndRender();
    
    // 🌟 নতুন জাদুকরী লজিক: রিভিউ পেজ থেকে আসলে অটোমেটিক মডেল পপআপ ওপেন করা 🌟
    const urlParams = new URLSearchParams(window.location.search);
    const modalId = urlParams.get('modal');
    if (modalId) {
        setTimeout(() => {
            openModal(Number(modalId));
            // পেজ রিলোড দিলে যেন বারবার ওপেন না হয়, তাই ইউআরএলটা ক্লিন করে দেওয়া
            window.history.replaceState({}, document.title, window.location.pathname);
        }, 600);
    }
    // 🌟 ম্যাজিক শেষ 🌟
    
    setTimeout(() => {
      const firstFocusable = document.querySelector('.hero-card.active');
      if(firstFocusable && !modalId) firstFocusable.focus(); // মডেল ওপেন না হলেই শুধু ফোকাস হবে
    }, 500);

  }catch(err){
    console.error('Data Load Error:', err);
    rowsEl.innerHTML = `<div class="empty-state">Unable to load data. Please ensure you are viewing this on a live server (Vercel/GitHub).</div>`;
  }
}

(function initVisitorStats(){
  const BASE_TOTAL = 729; const BASE_DATE = new Date(2026, 6, 3); const TICK_MS = 9000; 
  function mulberry32(seed){ let a = seed >>> 0; return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function dailyIncrement(daySeed){ return 20 + Math.floor(mulberry32(daySeed)() * 6); }
  function daysSinceBase(){ const now = new Date(); const a = new Date(now.getFullYear(), now.getMonth(), now.getDate()); const b = new Date(BASE_DATE.getFullYear(), BASE_DATE.getMonth(), BASE_DATE.getDate()); return Math.max(0, Math.round((a - b) / 86400000)); }
  function randInt(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }
  function baseTotalForToday(){ const n = daysSinceBase(); let total = BASE_TOTAL; for(let d = 1; d <= n; d++){ total += dailyIncrement(d); } return total; }

  let todayVisitors = randInt(30, 70); let activeViewers = randInt(5, 20); let totalVisitors = baseTotalForToday() + todayVisitors;

  function renderVisitorStats(){
    const el = document.getElementById('visitorStats');
    if(!el) return;
    el.innerHTML = `Today Visitors: <span style="color:var(--gold)">${todayVisitors}</span> • Active Viewers: <span style="color:#00ffcc">${activeViewers}</span> • Total Visitors: ${totalVisitors.toLocaleString()}`;
  }

  function tick(){ todayVisitors = randInt(30, 70); activeViewers = randInt(5, 20); totalVisitors += randInt(1, 4); renderVisitorStats(); }
  renderVisitorStats(); setInterval(tick, TICK_MS);
})();

initApp();
