<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAMguide BD — দেশি বিদেশি কন্টেন্ট স্ট্রিমিং গাইড</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Anton&family=Inter:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ef; --surface:#ffffff; --surface-2:#efe7d8;
    --text:#2b2620; --text-dim:#8a7f6a;
    --marquee:#b8341f; --gold:#c9860a; --line:#e3d3b4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--bg); color:var(--text); font-family:'Hind Siliguri','Inter',sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:60px; }
  a{color:inherit; text-decoration:none;}

  .ticker{ background:linear-gradient(90deg, var(--marquee), #b8341f); color:#fff; font-family:'Anton', sans-serif; letter-spacing:0.04em; font-size:13px; padding:6px 0; overflow:hidden; white-space:nowrap; }
  .ticker-track{ display:inline-block; padding-left:100%; animation: scroll-left 95s linear infinite; }
  .ticker-icon{ width:15px; height:15px; border-radius:4px; margin:0 5px 0 0; vertical-align:-2px; object-fit:contain; background:#fff; padding:1px; }
  .ticker-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:#22c55e; margin-left:5px; vertical-align:middle; box-shadow:0 0 5px 1px rgba(34,197,94,0.85); }
  .ticker-sep{ display:inline-block; margin:0 18px; color:rgba(255,255,255,0.55); font-weight:400; }
  @keyframes scroll-left{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }

  header{ position:sticky; top:0; z-index:50; background:rgba(250,246,239,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .header-inner{ max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:14px 20px; gap:12px; }
  .brand{ min-width:0; flex:1 1 auto; }
  .tagline{font-size:14px; color:var(--text-dim); margin-top:2px; letter-spacing:0.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .logo{ font-family:'Anton', sans-serif; font-size:26px; letter-spacing:-0.015em; display:flex; align-items:baseline; gap:0px; }
  .logo span.stream{color:var(--text); font-weight:900;}
  .logo span.guide-thin{color:var(--marquee); font-family:'Sacramento',cursive; font-weight:400; font-size:34px; letter-spacing:0; margin-left:-6px; margin-bottom:-2px;}
  .logo span.bd{color:var(--marquee); font-weight:900; margin-left:8px; -webkit-text-stroke:1.1px #fff; paint-order:stroke fill;}
  .search-box{ flex:1; display:flex; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:5px 9px; min-width:0; }
  .search-box input{ background:transparent; border:none; outline:none; color:var(--text); font-family:inherit; font-size:12px; width:100%; min-width:0; text-overflow:ellipsis; }
  .search-box svg{flex-shrink:0; opacity:0.5; width:13px; height:13px;}
  .header-right{ flex:0 0 auto; width:135px; display:flex; flex-direction:column; gap:5px; }
  .age-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:5px 9px; cursor:pointer; color:var(--text-dim); font-family:inherit; font-size:11px; font-weight:600; transition:all .18s ease; white-space:nowrap; }
  .age-toggle:hover{ color:var(--text); border-color:#3a3d45; }
  .age-toggle.on{ color:var(--text); }
  .age-toggle-track{ flex-shrink:0; width:24px; height:14px; border-radius:999px; background:#3a3d45; position:relative; transition:background .2s ease; margin-left:6px; }
  .age-toggle-thumb{ position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:#fff; transition:left .2s ease; }
  .age-toggle.on .age-toggle-track{ background:var(--marquee); }
  .age-toggle.on .age-toggle-thumb{ left:12px; }

  .filters{ max-width:1400px; margin:0 auto; display:flex; gap:8px; padding:14px 20px; overflow-x:auto; scrollbar-width:none; }
  .filters::-webkit-scrollbar{display:none;}
  .chip{ flex-shrink:0; border:1px solid var(--line); background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600; padding:8px 16px; border-radius:999px; cursor:pointer; transition:all .18s ease; white-space:nowrap; }
  .chip:hover{color:var(--text); border-color:#3a3d45;}
  .chip:focus-visible, .chip.active{ outline:none; border-color: var(--dot, var(--marquee)); color:var(--text); background:var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--dot, var(--marquee)); font-weight:700; }
  .chip .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; background:var(--dot, var(--marquee)); vertical-align:middle; }
  .chip-icon{ width:16px; height:16px; border-radius:4px; margin-right:7px; vertical-align:middle; object-fit:contain; background:#fff; padding:1px; }

  .hero{ max-width:1400px; margin:20px auto 8px; padding:0 20px; }
  .hero-carousel{ position:relative; }
  .hero-track{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth;
    border-radius:16px; scrollbar-width:none; outline:none;
  }
  .hero-track::-webkit-scrollbar{ display:none; }
  .hero-card{ position:relative; flex:0 0 100%; scroll-snap-align:start; overflow:hidden; min-height:340px; display:flex; align-items:flex-end; color:#fff;
    background: linear-gradient(0deg, rgba(11,12,15,0.96) 10%, rgba(11,12,15,0.3) 60%, rgba(11,12,15,0.5) 100%), var(--hero-grad);
    padding:36px; border:1px solid var(--line); cursor:pointer; }
  .hero-eyebrow{ font-family:'Anton', sans-serif; font-size:12px; letter-spacing:0.12em; color:var(--gold); margin-bottom:10px; }
  .hero-title{ font-family:'Anton', sans-serif; font-size:44px; letter-spacing:0.01em; line-height:1.05; margin-bottom:10px; max-width:640px; color:#fff; }
  .hero-stars{ font-size:15px; letter-spacing:1px; color:#ffc857; margin-bottom:4px; }
  .hero-stars-num{ color:#fff; font-size:13px; letter-spacing:0; margin-left:4px; opacity:0.85; }
  .hero-genre{ font-size:12.5px; color:rgba(255,255,255,0.75); margin-bottom:10px; }
  .hero-meta{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:rgba(255,255,255,0.75); font-size:14px; margin-bottom:18px; }
  .hero-stats-row{ display:flex; gap:16px; font-size:12px; color:rgba(255,255,255,0.75); margin-top:12px; }
  .badge{ font-size:11px; font-weight:700; letter-spacing:0.03em; padding:4px 10px; border-radius:5px; background:var(--dot); color:#0b0c0f; }
  .hero-cta{ display:inline-flex; align-items:center; gap:8px; background:#ffffff; color:#1a1a1a; font-weight:700; font-size:14px; padding:11px 22px; border-radius:8px; border:none; cursor:pointer; }
  .hero-cta:hover{background:var(--gold);}
  .hero-note{ font-size:11px; color:var(--text-dim); margin-top:8px; }
  .hero-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:6;
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(9,10,13,0.55); color:#fff; font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-arrow:hover{ background:rgba(9,10,13,0.85); }
  .hero-arrow.prev{ left:14px; }
  .hero-arrow.next{ right:14px; }
  .hero-dots{ display:flex; gap:6px; justify-content:center; margin-top:10px; }
  .hero-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); cursor:pointer; transition:all .15s ease; border:none; padding:0; }
  .hero-dot.active{ background:var(--marquee); width:20px; border-radius:4px; }

  .row-section{ max-width:1400px; margin:0 auto; padding:28px 20px 0; }
  .row-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .row-title{ font-family:'Anton', sans-serif; font-size:19px; letter-spacing:0.02em; display:flex; align-items:center; gap:9px; }
  .row-title::before{ content:""; display:inline-block; width:4px; height:18px; border-radius:3px; background:var(--marquee); }
  .row-sub{font-size:12px; color:var(--text-dim);}
  .row-scroll{ display:flex; gap:14px; overflow-x:auto; padding:4px 4px 16px; scroll-snap-type:x proximity; }
  .row-scroll::-webkit-scrollbar{height:6px;}
  .row-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .card{ scroll-snap-align:start; flex:0 0 180px; cursor:pointer; outline:none; position:relative; border-radius:12px; overflow:hidden; transition:transform .18s ease, box-shadow .18s ease; background:var(--surface); border:1px solid var(--line); box-shadow:0 2px 10px rgba(43,38,32,0.08); }
  .card:hover{ transform:translateY(-4px); box-shadow:0 14px 28px rgba(43,38,32,0.18); }
  .card .poster{ height:250px; width:100%; background:var(--grad); display:flex; align-items:flex-end; padding:12px; position:relative; }
  .card .poster-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .card .poster-img.adult-blur{ filter:blur(24px) saturate(1.15); transform:scale(1.15); }
  .adult-shield{ position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; background:rgba(11,12,15,0.45); color:#fff; text-align:center; padding:12px; }
  .adult-shield svg{ width:22px; height:22px; opacity:0.9; }
  .adult-shield span{ font-size:11px; font-weight:700; letter-spacing:0.02em; line-height:1.4; }
  .modal-image.adult-blur{ filter:blur(30px) saturate(1.15); }
  .modal-image .adult-shield{ background:rgba(11,12,15,0.55); }
  .card .poster::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.75) 100%); }
  .card .poster-title{ position:relative; z-index:1; font-family:'Anton', sans-serif; font-size:16px; line-height:1.15; color:#fff; }
  .card .platform-tag{ position:absolute; top:8px; left:8px; z-index:2; font-size:10px; font-weight:700; letter-spacing:0.03em; padding:3px 8px; border-radius:4px; background:var(--dot); color:#0b0c0f; }
  .card .new-tag{ position:absolute; top:8px; right:8px; z-index:2; font-size:9px; font-weight:700; padding:3px 6px; border-radius:4px; background:#fff; color:#0b0c0f; }
  .card-info{ padding:10px 12px 12px; font-size:12px; color:var(--text-dim); display:flex; flex-direction:column; gap:3px; }
  .card-info .cname{ color:var(--text); font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-info .meta-line{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fake-rating{ color:var(--gold); font-weight:700; }
  .card .overlay{ position:absolute; inset:0; z-index:3; background:rgba(9,10,13,0.92); padding:14px; display:flex; flex-direction:column; justify-content:flex-end; opacity:0; transform:scale(0.98); transition:opacity .16s ease, transform .16s ease; pointer-events:none; }
  .card:hover .overlay, .card:focus-visible .overlay, .card.tv-focus .overlay{ opacity:1; transform:scale(1); pointer-events:auto; }
  .overlay-title{font-family:'Anton', sans-serif; font-size:16px; margin-bottom:6px;}
  .overlay-meta{font-size:11.5px; color:var(--text-dim); line-height:1.6;}
  .overlay-btn{ margin-top:10px; font-size:12px; font-weight:700; background:var(--marquee); color:#fff; padding:9px 14px; border-radius:999px; text-align:center; display:inline-flex; align-items:center; justify-content:center; gap:6px; box-shadow:0 4px 14px rgba(232,72,44,0.4); align-self:flex-start; }
  .overlay-btn::before{ content:"▶"; font-size:9px; }
  .overlay-btn.manual::before{ content:none; }
  .overlay-btn.manual{ background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); font-weight:600; }
  .flag-btn{ margin-top:6px; font-size:10px; font-weight:600; background:transparent; border:none; color:var(--text-dim); text-decoration:underline; cursor:pointer; padding:2px 0; align-self:flex-start; }
  .flag-btn:hover{ color:var(--text); }
  .card:focus-visible, .card.tv-focus{ box-shadow: 0 0 0 3px var(--gold), 0 0 24px 2px color-mix(in srgb, var(--gold) 55%, transparent); transform:translateY(-4px) scale(1.04); z-index:5; }

  .empty-state{ max-width:1400px; margin:0 auto; padding:60px 20px; text-align:center; color:var(--text-dim); }
  .empty-state b{color:var(--gold);}

  /* ---------- detail modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:200;
    display:none; align-items:center; justify-content:center;
    padding:24px; overflow-y:auto;
  }
  .modal-overlay.open{ display:flex; }
  .modal-backdrop{
    position:fixed; inset:0; z-index:-1;
    background-size:cover; background-position:center;
    filter:blur(50px) brightness(0.35) saturate(1.2);
    transform:scale(1.15);
  }
  .modal-card{
    position:relative; width:100%; max-width:920px; max-height:88vh;
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    display:flex; overflow:hidden; box-shadow:0 30px 80px rgba(43,38,32,0.35);
    animation: modal-in .22s ease;
  }
  @keyframes modal-in{ from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-close{
    position:absolute; top:14px; right:14px; z-index:5;
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(9,10,13,0.65); color:#fff; font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-image{
    flex:0 0 42%; min-height:280px; background-size:cover; background-position:center; position:relative;
  }
  .modal-image::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, transparent 60%, var(--surface) 100%); }
  .modal-details{ flex:1; padding:32px 30px; overflow-y:auto; }
  .modal-platform-badge{ display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:5px; background:var(--dot); color:#0b0c0f; margin-bottom:12px; }
  .modal-title{ font-family:'Anton', sans-serif; font-size:28px; line-height:1.15; margin-bottom:14px; }
  .modal-meta-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;
    font-size:13px; color:var(--text-dim); margin-bottom:18px;
    padding-bottom:18px; border-bottom:1px solid var(--line);
  }
  .modal-meta-grid .label{ color:var(--text-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:2px; }
  .modal-meta-grid .value{ color:var(--text); font-size:14px; font-weight:600; }
  .modal-synopsis-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-dim); margin-bottom:6px; }
  .modal-synopsis{ font-size:14.5px; line-height:1.7; color:var(--text); margin-bottom:24px; }
  .modal-cta{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--marquee); color:#fff; font-weight:700; font-size:14.5px;
    padding:13px 26px; border-radius:9px; border:none; cursor:pointer; width:100%; justify-content:center;
  }
  .modal-cta:hover{ background:#c93a22; }
  .modal-cta.manual{ background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); }

  @media (max-width:720px){
    .modal-card{ flex-direction:column; max-height:92vh; }
    .modal-image{ flex:0 0 240px; width:100%; }
    .modal-image::after{ background:linear-gradient(0deg, var(--surface) 5%, transparent 40%); }
    .modal-details{ padding:22px 20px; }
    .modal-title{ font-size:22px; }
    .modal-meta-grid{ grid-template-columns:1fr 1fr; }
  }

  footer{ max-width:1400px; margin:40px auto 0; padding:24px 20px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--text-dim); }
  footer .dev-credit{color:var(--gold); font-weight:600;}
  .disclaimer{
    max-width:1400px; margin:36px auto 0; padding:16px 20px;
    font-size:12.5px; line-height:1.25; color:var(--text); font-weight:600;
    border-top:1px solid var(--line); text-align:center;
  }
  .disclaimer-label{ color:var(--marquee); font-weight:900; font-size:16px; }
  @media (min-width:680px){ .disc-br{ display:none; } }
  .visitor-stats{ margin-top:18px; font-size:10.5px; font-weight:500; color:var(--text-dim); letter-spacing:0.02em; opacity:0.9; }
  .notice{ max-width:1400px; margin:0 auto; padding:10px 20px 0; font-size:12px; color:var(--text-dim); }
  .notice b{color:var(--gold);}

  @media (max-width:640px){
    .hero-title{font-size:30px;}
    .hero-card{min-height:260px; padding:22px;}
    .card{flex:0 0 130px;}
    .card .poster{height:185px;}
    .header-inner{ padding:10px 14px; gap:8px; }
    .logo{font-size:20px;}
    .logo span.guide-thin{font-size:26px;}
    .tagline{font-size:11px;}
    .header-right{ width:108px; gap:4px; }
    .search-box{ padding:4px 7px; border-radius:6px; }
    .search-box input{ font-size:11px; }
    .search-box svg{ width:12px; height:12px; }
    .age-toggle{ padding:4px 7px; font-size:9.5px; border-radius:6px; }
    .age-toggle-track{ width:20px; height:12px; margin-left:4px; }
    .age-toggle-thumb{ width:8px; height:8px; }
    .age-toggle.on .age-toggle-thumb{ left:10px; }
  }

  @media (max-width:380px){
    .tagline{ display:none; }
  }

  /* ---------- বড় স্ক্রিন / টিভি (স্মার্ট টিভি, বড় মনিটর) এর জন্য স্কেল-আপ ---------- */
  @media (min-width:1600px){
    .header-inner, .filters, .hero, .row-section, footer, .disclaimer{ max-width:1800px; }
    .logo{ font-size:32px; }
    .logo span.guide-thin{ font-size:42px; }
    .tagline{ font-size:16px; }
    .search-box input{ font-size:14px; }
    .chip{ font-size:15px; padding:10px 20px; }
    .hero-card{ min-height:460px; padding:52px; }
    .hero-title{ font-size:60px; max-width:820px; }
    .hero-eyebrow{ font-size:14px; }
    .hero-meta{ font-size:16px; }
    .hero-cta{ font-size:16px; padding:14px 28px; }
    .row-title{ font-size:23px; }
    .row-sub{ font-size:14px; }
    .card{ flex:0 0 220px; }
    .card .poster{ height:305px; }
    .card .poster-title{ font-size:19px; }
    .card-info .cname{ font-size:15.5px; }
    .card-info .meta-line{ font-size:13px; }
    .visitor-stats{ font-size:12px; }
    .ticker{ font-size:15px; padding:8px 0; }
  }

  @media (min-width:2200px){
    .header-inner, .filters, .hero, .row-section, footer, .disclaimer{ max-width:2200px; }
    .hero-card{ min-height:560px; }
    .hero-title{ font-size:72px; max-width:960px; }
    .card{ flex:0 0 260px; }
    .card .poster{ height:360px; }
  }
</style>
</head>
<script type="module">
  // Client-side NSFW image detection (runs entirely in the browser — no image ever leaves the device).
  // Loaded as an ES module bundle via jsDelivr's +esm endpoint so it works from a plain <script> tag.
  try {
    const tf = await import("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/+esm");
    const nsfwjs = await import("https://cdn.jsdelivr.net/npm/nsfwjs@4.2.1/+esm");
    window.__tf = tf;
    window.__nsfwjs = nsfwjs;
  } catch (err) {

    window.__nsfwjs = null;
  }
</script>
<body>

  <div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="logo"><span class="stream">STREAM</span><span class="guide-thin">guide</span><span class="bd">BD</span></div>
        <div class="tagline">কন্টেন্ট স্ট্রিমিং গাইড, সেরা প্ল্যাটফর্ম - প্রিয় রিলিজ</div>
      </div>
      <div class="header-right">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="টাইটেল খুঁজুন...">
        </div>
        <button class="age-toggle" id="ageToggle" type="button" aria-pressed="false">
          <span class="age-toggle-label">Enable 18+</span>
          <span class="age-toggle-track"><span class="age-toggle-thumb"></span></span>
        </button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
  </header>



  <section class="hero" id="heroSection"></section>
  <main id="rowsContainer"></main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="বন্ধ করো">✕</button>
    </div>

function hashSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function fakeRatingFor(t, p){
  const seed = hashSeed(t + p);
  return (3.5 + (seed % 16) / 10).toFixed(1); // 3.5 - 5.0
}
function fakeViewsFor(t, p){
  const seed = hashSeed(p + t + 'views');
  const val = 500 + (seed % 49500); // 500 - 50000
  return val >= 1000 ? (val/1000).toFixed(1) + 'k' : String(val);
}

// ---------- Automatic nudity detection (NSFWJS, runs fully client-side) ----------
const NSFW_THRESHOLD = 0.55; // combined Porn + Hentai + Sexy probability that triggers a blur
const nsfwCache = new Map(); // image URL -> boolean (flagged or not)
let nsfwModelPromise = null;

function loadNSFWModel(){
  if(!nsfwModelPromise){
    nsfwModelPromise = (async () => {
      if(!window.__nsfwjs) return null;
      try { return await window.__nsfwjs.load(); }
      catch(err){ console.warn('NSFW model failed to load:', err); return null; }
    })();
  }
  return nsfwModelPromise;
}

async function checkImageNSFW(url){
  if(!url) return false;
  if(nsfwCache.has(url)) return nsfwCache.get(url);
  try{
    const model = await loadNSFWModel();
    if(!model) return false;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });
    const predictions = await model.classify(img);
    const score = predictions
      .filter(p => p.className === 'Porn' || p.className === 'Hentai' || p.className === 'Sexy')
      .reduce((sum, p) => sum + p.probability, 0);
    const flagged = score >= NSFW_THRESHOLD;
    nsfwCache.set(url, flagged);
    return flagged;
  }catch(err){
    // Most likely a CORS-blocked image host — silently skip, don't break the page.
    nsfwCache.set(url, false);
    return false;
  }
}

  }
}

let cardObserver = null;
function observeCardsForNSFW(){
  if(!window.__nsfwjs) return; // library failed to load — skip auto-detection entirely
  if(cardObserver) cardObserver.disconnect();
  cardObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(!entry.isIntersecting) return;
      const card = entry.target;
      cardObserver.unobserve(card);
      const id = Number(card.dataset.id);
      const item = DATA.find(d => d.id === id);
      if(!item || !item.img || item.adult || item.autoAdult || item.userFlag === 'safe') return;
      checkImageNSFW(item.img).then(flagged => {
        if(flagged && item.userFlag !== 'safe'){
          item.autoAdult = true;
          if(!show18Plus) applyAdultBlurToCard(card);
        }
      });
    });
  }, { rootMargin: '250px' });
  document.querySelectorAll('.card[data-id]').forEach(c => cardObserver.observe(c));
}

function shuffledSample(arr, n){
  const copy = [...arr];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

        <div class="hero-eyebrow">${activeFilter === 'all' ? 'তোমার জন্য' : 'সর্বশেষ রিলিজ'}</div>
        <div class="hero-title">${item.t}</div>
        <div class="hero-stars">★★★★☆ <span class="hero-stars-num">${item.fakeRating}</span></div>
        <div class="hero-genre">${item.fakeGenre}</div>
        <div class="hero-meta"><span class="badge" style="--dot:${plat.color}">${heroPlatformLabel}</span><span>${fmtDate(item.date)}</span><span>•</span><span>${item.dur}</span></div>
        <button class="hero-cta" style="border:none; cursor:pointer;" onclick="event.stopPropagation(); openModal(${item.id});">বিস্তারিত দেখো</button>
        <div class="hero-stats-row"><span>★ ${item.fakeRating}</span><span>👁 ${item.fakeViews}</span></div>
      </div>
    </div>`;
}

let heroAutoplayTimer = null;
const HERO_AUTOPLAY_MS = 10000; // ফিচার ক্যারাসোল প্রতি ১০ সেকেন্ডে অটো-চেঞ্জ হবে, রিপিট মুডে

function renderHero(list){
  const heroEl = document.getElementById('heroSection');
  if(heroAutoplayTimer){ clearInterval(heroAutoplayTimer); heroAutoplayTimer = null; }
  if(!list.length){ heroEl.innerHTML = ''; return; }

  // হোম/সব ট্যাবে র‍্যান্ডম কয়েকটা কন্টেন্ট দিয়ে সোয়াইপযোগ্য ক্যারোসেল, নাহলে শুধু সবচেয়ে সাম্প্রতিকটা
  // ডিফল্ট "সব" ট্যাবে শুধু দেশি প্ল্যাটফর্মের কন্টেন্ট দেখানো হবে, আন্তর্জাতিক বাদ
  const heroPool = activeFilter === 'all' ? list.filter(d => PLATFORMS[d.p].group !== 'intl') : list;
  if(!heroPool.length){ heroEl.innerHTML = ''; return; }
  const slides = activeFilter === 'all' ? shuffledSample(heroPool, Math.min(6, heroPool.length)) : [heroPool[0]];

  heroEl.innerHTML = `
    <div class="hero-carousel">
      ${slides.length > 1 ? `<button class="hero-arrow prev" aria-label="আগেরটা">‹</button>` : ''}
      <div class="hero-track" id="heroTrack" tabindex="0">
        ${slides.map(heroSlideHTML).join('')}
      </div>
      ${slides.length > 1 ? `<button class="hero-arrow next" aria-label="পরেরটা">›</button>` : ''}
    </div>
    ${slides.length > 1 ? `<div class="hero-dots" id="heroDots">${slides.map((_,i)=>`<button class="hero-dot ${i===0?'active':''}" data-i="${i}"></button>`).join('')}</div>` : ''}
  `;

  const track = document.getElementById('heroTrack');
  const dotsEl = document.getElementById('heroDots');
  let heroIdx = 0;

  const goTo = (i)=>{
    heroIdx = Math.max(0, Math.min(slides.length - 1, i));
    track.scrollTo({ left: heroIdx * track.clientWidth, behavior: 'smooth' });
    if(dotsEl) dotsEl.querySelectorAll('.hero-dot').forEach((d,idx)=> d.classList.toggle('active', idx===heroIdx));
  };

  heroEl.querySelectorAll('.hero-card').forEach(c=>{
    c.addEventListener('click', ()=> openModal(Number(c.dataset.id)));
  });

  const prevBtn = heroEl.querySelector('.hero-arrow.prev');
  const nextBtn = heroEl.querySelector('.hero-arrow.next');
  if(prevBtn) prevBtn.addEventListener('click', ()=> goTo(heroIdx - 1));
  if(nextBtn) nextBtn.addEventListener('click', ()=> goTo(heroIdx + 1));
  if(dotsEl) dotsEl.querySelectorAll('.hero-dot').forEach(d=>{
    d.addEventListener('click', ()=> goTo(Number(d.dataset.i)));
  });

  // রিমোট/কীবোর্ড দিয়ে সোয়াইপ (ট্র্যাকে ফোকাস থাকলে)
  track.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowRight'){ e.preventDefault(); goTo(heroIdx + 1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); goTo(heroIdx - 1); }
  });

  function startAutoplay(){
    if(slides.length <= 1) return;
    if(heroAutoplayTimer) clearInterval(heroAutoplayTimer);
    heroAutoplayTimer = setInterval(()=>{
      goTo((heroIdx + 1) % slides.length); // শেষ স্লাইডের পর আবার প্রথম থেকে শুরু (রিপিট)
    }, HERO_AUTOPLAY_MS);
  }
  function stopAutoplay(){ if(heroAutoplayTimer){ clearInterval(heroAutoplayTimer); heroAutoplayTimer = null; } }

  // টাচ সোয়াইপ নেটিভ স্ক্রলেই কাজ করে, স্ক্রল থামলে কোন স্লাইডে আছি সেটা ধরে ডট আপডেট করা
  // এখানেই autoplay আবার নিশ্চিতভাবে চালু করে দেওয়া হয় (নিরাপত্তা-রিস্টার্ট) — যাতে কোনো
  // কারণে থেমে গেলেও (touch event miss হওয়া ইত্যাদি) স্ক্রল থামার পর সবসময় আবার চলতে শুরু করে।
  let scrollTimeout;
  track.addEventListener('scroll', ()=>{
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(()=>{
      heroIdx = Math.max(0, Math.min(slides.length - 1, Math.round(track.scrollLeft / track.clientWidth)));
      if(dotsEl) dotsEl.querySelectorAll('.hero-dot').forEach((d,idx)=> d.classList.toggle('active', idx===heroIdx));
      startAutoplay();
    }, 100);
  });

  // ---------- ক্যারাসোল অটোপ্লে (রিপিট মুড, প্রতি ১০ সেকেন্ডে চেঞ্জ) ----------
  if(slides.length > 1){
    startAutoplay();
    // ইউজার নিজে সোয়াইপ/ক্লিক করলে সাময়িক থামিয়ে আবার শুরু করা, যাতে হাত থেকে না কাড়ে
    heroEl.addEventListener('mouseenter', stopAutoplay);
    heroEl.addEventListener('mouseleave', startAutoplay);
    heroEl.addEventListener('touchstart', stopAutoplay, {passive:true});
    heroEl.addEventListener('touchend', startAutoplay, {passive:true});
    [prevBtn, nextBtn].forEach(b=> b && b.addEventListener('click', startAutoplay));
    if(dotsEl) dotsEl.querySelectorAll('.hero-dot').forEach(d=> d.addEventListener('click', startAutoplay));
  }
}

function render(){
  const rows = document.getElementById('rowsContainer');

  let pool = DATA.filter(d=>{
    if(d.merged) return false; // ডুপ্লিকেট এন্ট্রি, প্রাইমারি কার্ডে মার্জ হয়ে গেছে
    if(activeFilter === "all"){
      // ফিচার ট্যাবে ডিফল্টভাবে আন্তর্জাতিক কন্টেন্ট দেখানো হবে না (হইচই এর মতো দেশি প্ল্যাটফর্ম বাদে);
      // 18+ সুইচ অন করলে সব কন্টেন্ট (আন্তর্জাতিক সহ) দেখানো হবে।
      if(!show18Plus && PLATFORMS[d.p].group === "intl") return false;
      return true;
    }
    if(activeFilter === "intl") return PLATFORMS[d.p].group === "intl";
    return d.p === activeFilter;
  });
  if(searchQuery) pool = pool.filter(d => d.t.toLowerCase().includes(searchQuery.toLowerCase()) || (d.cast||'').toLowerCase().includes(searchQuery.toLowerCase()) || (d.synopsis||'').toLowerCase().includes(searchQuery.toLowerCase()));
  pool.sort((a,b)=> a.days - b.days);

  renderHero(show18Plus ? pool : pool.filter(d => d.userFlag === 'safe' || (!d.adult && !d.autoAdult && d.userFlag !== 'flag')));

  const last7 = pool.filter(d=>d.days<=7);
  const d8to30 = pool.filter(d=>d.days>7 && d.days<=30);
  const older = pool.filter(d=>d.days>30);
  let html = '';

  if(last7.length){
    html += `<div class="row-section"><div class="row-head"><div class="row-title">গত ৭ দিনের নতুন রিলিজ</div><div class="row-sub">${last7.length}টি</div></div><div class="row-scroll">${last7.map(cardHTML).join('')}</div></div>`;
  }
  if(d8to30.length){
    html += `<div class="row-section"><div class="row-head"><div class="row-title">৮–৩০ দিনের মধ্যে</div><div class="row-sub">${d8to30.length}টি</div></div><div class="row-scroll">${d8to30.map(cardHTML).join('')}</div></div>`;
  }
  if(older.length){
    html += `<div class="row-section"><div class="row-head"><div class="row-title">আরও কনটেন্ট</div><div class="row-sub">${older.length}টি</div></div><div class="row-scroll">${older.map(cardHTML).join('')}</div></div>`;
  }
  if(!pool.length){
    html = `<div class="empty-state">কোনো ফলাফল পাওয়া যায়নি।</div>`;
  }
  rows.innerHTML = html;

  rows.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openModal(Number(c.dataset.id)));
    c.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ c.click(); } });
  });

  observeCardsForNSFW();
}

document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery = e.target.value; render(); });

const ageToggle = document.getElementById('ageToggle');
ageToggle.addEventListener('click', ()=>{
  show18Plus = !show18Plus;
  ageToggle.classList.toggle('on', show18Plus);

document.addEventListener('keydown', (e)=>{
  const focused = document.activeElement;
  if(!focused || !focused.classList.contains('card')) return;
  const allRows = Array.from(document.querySelectorAll('.row-scroll'));
  const currentRow = focused.closest('.row-scroll');
  if(!currentRow) return;
  const cardsInRow = Array.from(currentRow.querySelectorAll('.card'));
  const idx = cardsInRow.indexOf(focused);
  const rowIdx = allRows.indexOf(currentRow);
  if(e.key === 'ArrowRight' && idx < cardsInRow.length-1){ e.preventDefault(); cardsInRow[idx+1].focus(); cardsInRow[idx+1].scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); }
  else if(e.key === 'ArrowLeft' && idx > 0){ e.preventDefault(); cardsInRow[idx-1].focus(); cardsInRow[idx-1].scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); }
  else if(e.key === 'ArrowDown' && rowIdx < allRows.length-1){ e.preventDefault(); const nextRowCards = Array.from(allRows[rowIdx+1].querySelectorAll('.card')); (nextRowCards[Math.min(idx, nextRowCards.length-1)] || nextRowCards[0]).focus(); }
  else if(e.key === 'ArrowUp' && rowIdx > 0){ e.preventDefault(); const prevRowCards = Array.from(allRows[rowIdx-1].querySelectorAll('.card')); (prevRowCards[Math.min(idx, prevRowCards.length-1)] || prevRowCards[0]).focus(); }
});

// ---------- Detail modal ----------
function openModal(id){
  const item = DATA.find(d => d.id === id);
  if(!item) return;
  const plat = PLATFORMS[item.p];
  const platformList = item.platforms || [item.p];

  const backdrop = document.getElementById('modalBackdrop');
  backdrop.style.backgroundImage = item.img ? `url('${item.img}')` : `${item.grad}`;

  const card = document.getElementById('modalCard');
  const btn = platformList.length > 1
    ? platformList.map(pk => {
        const pp = PLATFORMS[pk];
        return pp.manual
          ? `<button class="modal-cta manual" onclick="window.open('${pp.base !== '#' ? pp.base : item.url}','_blank')">${pp.name}-এ ম্যানুয়ালি খুঁজুন</button>`
          : `<button class="modal-cta" onclick="window.open('${item.url}','_blank')">${pp.name}-এ দেখো ↗</button>`;
      }).join('')
    : (plat.manual
        ? `<button class="modal-cta manual" onclick="window.open('${plat.base !== '#' ? plat.base : item.url}','_blank')">নিজ প্ল্যাটফর্মে ম্যানুয়ালি খুঁজুন</button>`
        : `<button class="modal-cta" onclick="window.open('${item.url}','_blank')">${plat.name}-এ দেখো ↗</button>`);
  const modalPlatformLabel = platformList.map(pk => PLATFORMS[pk].name).join(' / ');

  const modalForcedSafe = item.userFlag === 'safe';
  const modalForcedFlag = item.userFlag === 'flag';
  const modalBlurred = !show18Plus && !modalForcedSafe && (modalForcedFlag || item.adult || item.autoAdult);
  const modalShield = modalBlurred ? `<div class="adult-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>18+ কনটেন্ট<br>দেখতে হেডারের সুইচ অন করো</span></div>` : '';
  const modalFlagBtn = modalBlurred
    ? `<button class="flag-btn" onclick="setContentFlag(${item.id}, 'safe');">👁 নিরাপদ, আনব্লার করো</button>`
    : `<button class="flag-btn" onclick="setContentFlag(${item.id}, 'flag');">🚩 অনুপযুক্ত রিপোর্ট করো</button>`;
  card.innerHTML = `
    <button class="modal-close" id="modalClose" aria-label="বন্ধ করো">✕</button>
    <div class="modal-image${modalBlurred ? ' adult-blur' : ''}" style="background-image:${item.img ? `url('${item.img}')` : item.grad};">${modalShield}</div>
    <div class="modal-details">
      <span class="modal-platform-badge" style="background:${plat.color}">${modalPlatformLabel}</span>
      <div class="modal-title">${item.t}</div>
      <div class="modal-meta-grid">
        <div><div class="label">আপলোডের তারিখ</div><div class="value">${fmtDate(item.date)}</div></div>
        <div><div class="label">রানটাইম</div><div class="value">${item.dur || 'N/A'}</div></div>
        <div><div class="label">প্ল্যাটফর্ম</div><div class="value">${modalPlatformLabel}</div></div>
        <div><div class="label">রেটিং</div><div class="value">★ ${item.fakeRating}</div></div>
        <div><div class="label">জনরা</div><div class="value">${item.fakeGenre}</div></div>
        <div><div class="label">ভিউ</div><div class="value">👁 ${item.fakeViews}</div></div>
        ${item.cast ? `<div style="grid-column:1/-1;"><div class="label">আর্টিস্ট</div><div class="value">${item.cast}</div></div>` : ''}
      </div>
      ${item.synopsis ? `<div class="modal-synopsis-label">ব্রিফিং</div><div class="modal-synopsis">${item.synopsis}</div>` : ''}
      ${btn}
      ${modalFlagBtn}
    </div>`;

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  if(item.img && !item.adult && !item.autoAdult && item.userFlag !== 'safe'){
    checkImageNSFW(item.img).then(flagged=>{
      if(flagged && item.userFlag !== 'safe'){
        item.autoAdult = true;
        if(!show18Plus && document.getElementById('modalOverlay').classList.contains('open')){
          const stillSameItem = document.getElementById('modalCard').querySelector('.modal-title')?.textContent === item.t;
          if(stillSameItem) openModal(id);
        }
      }
    });
  }
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeModal();
});

}

(function initVisitorStats(){
  const BASE_TOTAL = 729;
  const BASE_DATE = new Date(2026, 6, 3);
  const TICK_MS = 9000; // প্রতি ৯ সেকেন্ডে সংখ্যাগুলো আপডেট হবে

  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function dailyIncrement(daySeed){
    return 20 + Math.floor(mulberry32(daySeed)() * 6);
  }
  function daysSinceBase(){
    const now = new Date();
    const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const b = new Date(BASE_DATE.getFullYear(), BASE_DATE.getMonth(), BASE_DATE.getDate());
    return Math.max(0, Math.round((a - b) / 86400000));
  }
  function toBn(num){
    const digits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    return String(num).replace(/[0-9]/g, d => digits[d]);
  }
  function randInt(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

  // দিন-ভিত্তিক ক্রমবর্ধমান বেস (আগের দিনগুলোর যোগফল), যাতে টোটাল ভিজিটর প্রতিদিনই বাড়তে থাকে
  function baseTotalForToday(){
    const n = daysSinceBase();
    let total = BASE_TOTAL;
    for(let d = 1; d <= n; d++){ total += dailyIncrement(d); }
    return total;
  }

  let todayVisitors = randInt(30, 70);
  let activeViewers = randInt(5, 20);
  let totalVisitors = baseTotalForToday() + todayVisitors;

  function renderVisitorStats(){
    const el = document.getElementById('visitorStats');
    if(!el) return;
    el.textContent = `আজকের ভিজিটর: ${toBn(todayVisitors)} জন • সক্রিয় ভিউয়ার: ${toBn(activeViewers)} জন • টোটাল ভিজিটর: ${toBn(totalVisitors)} জন`;
  }

  function tick(){
    todayVisitors = randInt(30, 70);
    activeViewers = randInt(5, 20);
    totalVisitors += randInt(1, 4); // টোটাল সবসময় সামান্য বাড়তেই থাকবে, কখনো কমবে না
    renderVisitorStats();
  }

  renderVisitorStats();
  setInterval(tick, TICK_MS);
})();
</script>
